      if (el) {
        el.style.display = 'block';
        el.textContent = '❌ JavaScriptエラー:\n' + msg + '\n(行: ' + line + ')';

function TextInput({ type = "text", value, onChange, placeholder, error, autocomplete }) {
  const [focused, setFocused] = useState(false);
  return (
    <input
      type={type} value={value} onChange={onChange} placeholder={placeholder}
      autoComplete={autocomplete}
      onFocus={() => setFocused(true)}
      onBlur={() => setFocused(false)}
      style={{
        width: "100%", fontSize: 18, padding: "15px 18px",
        borderRadius: 14, border: `2px solid ${error ? C.red : focused ? C.blue : C.grayL}`,
        boxSizing: "border-box", fontFamily: "inherit", outline: "none",
        background: focused ? "#f0f5ff" : C.white, color: C.navy,
        boxShadow: focused ? "0 0 0 4px rgba(41,82,200,0.08)" : "none",
        transition: "all 0.2s",
      }}
    />
  );
}

// ── ログイン画面 ─────────────────────────────────────────
function LoginScreen({ onLogin, onRegister, onForgot }) {
  const [email, setEmail]       = useState("");
  const [password, setPassword] = useState("");
  const [errors, setErrors]     = useState({});
  const [loading, setLoading]   = useState(false);

  const handleLogin = async () => {
    const errs = {};
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errs.email = "正しいメールアドレスを入力してください";
    if (!password) {
      errs.password = "パスワードを入力してください";
    } else if (password.length < 8) {
      errs.password = "パスワードは8文字以上で入力してください";
    } else if (!/[a-zA-Z]/.test(password)) {
      errs.password = "パスワードに英字（大文字または小文字）を1文字以上含めてください";
    } else if (!/[0-9]/.test(password)) {
      errs.password = "パスワードに数字を1文字以上含めてください";
    }
    if (Object.keys(errs).length) { setErrors(errs); return; }
    setLoading(true);
    const { data, error } = await sb.auth.signInWithPassword({ email: email.toLowerCase(), password });
    if (error) { setLoading(false); setErrors({ password: "メールアドレスまたはパスワードが正しくありません" }); return; }
    const role = data.user?.user_metadata?.role ?? "user";
    const { data: profile } = await sb.from('profiles').select('name, company_id').eq('id', data.user.id).maybeSingle();
    // name が空の場合はメールアドレスの @ 前を仮名として自動設定
    if (!profile?.name) {
      const fallbackName = email.split('@')[0];
      await sb.from('profiles').upsert(
        { id: data.user.id, name: fallbackName },
        { onConflict: 'id' }
      );
    }
    if (!["admin","manager","staff"].includes(role)) {
      if (profile?.company_id) {
        const { data: company } = await sb.from('companies').select('is_active').eq('id', profile.company_id).single();
        if (company && !company.is_active) {
          await sb.auth.signOut();
          setLoading(false);

function ForgotScreen({ onBack }) {
  const [email, setEmail]     = useState("");
  const [sent, setSent]       = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError]     = useState("");

  const handleSendReset = async () => {
    if (!email) return;
    setLoading(true);
    setError("");
    try {
      const res = await fetch(
        `${SUPABASE_URL}/functions/v1/send-reset-email`,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify({ email }),
        }
      );
      if (res.ok) {
        setSent(true);
      } else {
        const err = await res.json().catch(() => ({}));
        setError(err.error || '送信に失敗しました。メールアドレスを確認してください。');
      }
    } catch (e) {
      setError('送信に失敗しました。メールアドレスを確認してください。');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="login-root" style={{ justifyContent: "center" }}>
      <div style={{ maxWidth: 520, width: "100%", margin: "0 auto", padding: "40px 20px", position: "relative", zIndex: 1 }}>

                <div style={{ color: C.red, fontSize: 13, marginBottom: 10, textAlign: "center" }}>{error}</div>

// ── パスワード再設定画面 ──────────────────────────────────
function ResetPasswordScreen({ onDone }) {
  const [pw, setPw]               = useState("");
  const [pwConfirm, setPwConfirm] = useState("");
  const [errors, setErrors]       = useState({});
  const [submitting, setSubmitting]     = useState(false);
  const [sessionLoading, setSessionLoading] = useState(true); // バックグラウンドで処理中
  const [sessionError, setSessionError] = useState("");
  const [done, setDone]           = useState(false);

  useEffect(() => {
    const params = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const accessToken  = params.get('access_token');
    const refreshToken = params.get('refresh_token');
    if (!accessToken || !refreshToken) {
      setSessionError("無効なリンクです。パスワードリセットメールを再度お送りください。");
      setSessionLoading(false);
      return;
    }
    // JWT issued at future エラー対策: 1秒待機してからsetSession
    const timer = setTimeout(async () => {
      const { error } = await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
      if (error) {
        setSessionError("リンクの有効期限が切れています。もう一度パスワードリセットをお試しください。");
      }
      setSessionLoading(false);
    }, 1000);
    return () => clearTimeout(timer);
  }, []);

  const handleSubmit = async () => {
    const errs = {};
    if (pw.length < 8)    errs.pw = "パスワードは8文字以上で入力してください";
    if (pw !== pwConfirm) errs.pwConfirm = "パスワードが一致しません";
    setErrors(errs);
    if (Object.keys(errs).length) return;

    setSubmitting(true);
    const { error } = await sb.auth.updateUser({ password: pw });
    setSubmitting(false);
    if (error) {
      setErrors({ pw: "パスワードの更新に失敗しました。もう一度お試しください。" });
      return;
    }
    history.replaceState(null, '', window.location.pathname);
    setDone(true);
  };

  return (
    <div className="login-root" style={{ justifyContent: "center" }}>
      <div style={{ maxWidth: 520, width: "100%", margin: "0 auto", padding: "40px 20px", position: "relative", zIndex: 1 }}>
        <div className="login-card">
          {done ? (
            <div style={{ textAlign: "center", padding: "16px 0" }}>
              <div style={{ fontSize: 52, marginBottom: 14 }}>✅</div>
              <div style={{ fontSize: 22, fontWeight: 800, color: C.navy, marginBottom: 10 }}>パスワードを変更しました！</div>
              <div style={{ fontSize: 15, color: C.gray, lineHeight: 1.9, marginBottom: 28,
                background: C.bg, borderRadius: 12, padding: "14px" }}>
                新しいパスワードでログインしてください
              </div>
              <PrimaryBtn onClick={onDone}>ログイン画面へ</PrimaryBtn>
            </div>
          ) : (
            <>
              <div style={{ textAlign: "center", marginBottom: 24 }}>
                <div style={{ fontSize: 40, marginBottom: 10 }}>🔑</div>
                <div style={{ fontSize: 20, fontWeight: 800, color: C.navy, marginBottom: 6 }}>新しいパスワードを設定</div>
                <div style={{ fontSize: 14, color: C.gray, lineHeight: 1.8 }}>
                  8文字以上の新しいパスワードを入力してください
                </div>
              </div>
              <FieldWrap label="🔑 新しいパスワード" error={errors.pw}>
                <PwInput value={pw} error={errors.pw} placeholder="新しいパスワード（8文字以上）"
                  onChange={e => { setPw(e.target.value); setErrors(er => ({ ...er, pw: "" })); }} />
              </FieldWrap>
              <FieldWrap label="🔑 パスワード（確認）" error={errors.pwConfirm}>
                <PwInput value={pwConfirm} error={errors.pwConfirm} placeholder="パスワードをもう一度入力"
                  onChange={e => { setPwConfirm(e.target.value); setErrors(er => ({ ...er, pwConfirm: "" })); }} />
              </FieldWrap>
              {sessionError && (
                <div style={{ color: C.red, fontSize: 13, marginBottom: 14, textAlign: "center" }}>
                  ⚠️ {sessionError}
                </div>
              )}
              {sessionError ? (
                <PrimaryBtn onClick={onDone}>ログイン画面にもどる</PrimaryBtn>
              ) : (
                <PrimaryBtn onClick={handleSubmit} disabled={sessionLoading || submitting}>
                  {submitting ? "更新中..." : sessionLoading ? "準備中..." : "パスワードを変更する"}
                </PrimaryBtn>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function LoginApp({ onLogin, onRegister }) {
  const [screen, setScreen] = useState("login");
  if (screen === "login")  return <LoginScreen
    onLogin={(email, role) => onLogin(role)}
    onRegister={onRegister}
    onForgot={() => setScreen("forgot")} />;
  if (screen === "forgot") return <ForgotScreen onBack={() => setScreen("login")} />;
  return <LoginScreen
    onLogin={(email, role) => onLogin(role)}
    onRegister={onRegister}
    onForgot={() => setScreen("forgot")} />;
}

function PwStrength({ pw }) {
  if (!pw) return null;
  let score = 0;
  if (pw.length>=8) score++; if (pw.length>=12) score++;
  if (/[A-Z]/.test(pw)) score++; if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  const lv = score<=1?{label:"弱い",color:"#e63946",w:"20%"}
    :score<=3?{label:"ふつう",color:"#f07800",w:"60%"}
    :{label:"強い 💪",color:C.green,w:"100%"};
  return (
    <div style={{ marginTop:8 }}>
      <div style={{ height:5, background:"#e8edf8", borderRadius:99, overflow:"hidden" }}>
        <div style={{ height:"100%", width:lv.w, background:lv.color, borderRadius:99, transition:"width 0.3s" }}/>
      </div>
      <div style={{ fontSize:12, color:lv.color, marginTop:4, fontWeight:700 }}>強度：{lv.label}</div>
    </div>
  );
}

            {checking?"確認中...":verified?"✓ 確認済":"確認する"}
          </button>
        </div>
      </RgField>

      {verified && company && (
        <div style={{ background:"#f0faf5", border:"2px solid "+C.green,
          borderRadius:14, padding:"16px 18px", marginBottom:20 }}>

          <div style={{ fontSize:13, color:C.gray, marginTop:2 }}>この企業に登録します</div>
        </div>
      )}

      <RgPrimaryBtn onClick={()=>{ if(verified) onNext(); else handleCheck(); }}
        disabled={!verified}>
        つぎへ → 個人情報の入力
      </RgPrimaryBtn>
    </div>
  );
}

// ── STEP 2: 個人情報入力 ────────────────────────────────
function Step2({ data, setData, companyId, companyName, onNext, onBack, loading, regError }) {
  const [errors, setErrors] = useState({});

  const company = companyName || "";
  const pw = data.password || "";

  const validate = () => {
    const e = {};
    if (!data.lastName?.trim())      e.lastName      = "姓を入力してください";
    if (!data.firstName?.trim())     e.firstName     = "名を入力してください";
    if (!data.lastNameKana?.trim())  e.lastNameKana  = "姓（ふりがな）を入力してください";
    if (!data.firstNameKana?.trim()) e.firstNameKana = "名（ふりがな）を入力してください";
    if (!/^[\d\-]{10,13}$/.test((data.phone||"").replace(/\s/g,"")))
      e.phone = "正しい電話番号を入力してください";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email))
      e.email = "正しいメールアドレスを入力してください";
    if (pw.length < 8) {
      e.password = "パスワードは8文字以上で入力してください";
    } else if (!/[a-zA-Z]/.test(pw)) {
      e.password = "パスワードに英字（大文字または小文字）を1文字以上含めてください";
    } else if (!/[0-9]/.test(pw)) {
      e.password = "パスワードに数字を1文字以上含めてください";
    }
    if (data.confirmPw !== pw) e.confirmPw = "パスワードが一致しません";
    setErrors(e);
    return !Object.keys(e).length;
  };

  const bind = (key) => ({
    value: data[key]||"",
    onChange: e => { setData(d=>({...d,[key]:e.target.value})); setErrors(er=>({...er,[key]:""})); },
    error: errors[key],
  });

  return (
    <div style={{ padding:"0 24px 28px" }}>

      {/* 会社名表示 */}
      <div style={{ background:"linear-gradient(135deg,#0a1f5c,#1a3a8f)",
        borderRadius:12, padding:"12px 16px", marginBottom:20 }}>
        <div style={{ fontSize:11, color:C.yellow, fontWeight:700, marginBottom:2 }}>登録先企業</div>
        <div style={{ fontSize:16, fontWeight:800, color:C.white }}>{company}</div>
        <div style={{ fontSize:12, color:"rgba(255,255,255,0.6)", marginTop:2 }}>企業ID：{companyId}</div>
      </div>

      {/* 氏名（漢字）*/}
      <div style={{ marginBottom:18 }}>
        <div style={{ fontSize:15, fontWeight:700, color:C.navy, marginBottom:7 }}>👤 氏名</div>
        <div style={{ display:"flex", gap:8 }}>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:12, color:C.gray, marginBottom:4, fontWeight:600 }}>姓（苗字）</div>
            <RgTextInput placeholder="例：田中" error={errors.lastName} {...bind("lastName")} />
            {errors.lastName && <div style={{ color:C.red, fontSize:13, marginTop:4 }}>⚠️ {errors.lastName}</div>}
          </div>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:12, color:C.gray, marginBottom:4, fontWeight:600 }}>名（名前）</div>
            <RgTextInput placeholder="例：太郎" error={errors.firstName} {...bind("firstName")} />
            {errors.firstName && <div style={{ color:C.red, fontSize:13, marginTop:4 }}>⚠️ {errors.firstName}</div>}
          </div>
        </div>
      </div>
      {/* 氏名（ふりがな）*/}
      <div style={{ marginBottom:18 }}>
        <div style={{ fontSize:15, fontWeight:700, color:C.navy, marginBottom:7 }}>👤 ふりがな</div>
        <div style={{ display:"flex", gap:8 }}>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:12, color:C.gray, marginBottom:4, fontWeight:600 }}>姓（ふりがな）</div>
            <RgTextInput placeholder="例：たなか" error={errors.lastNameKana} {...bind("lastNameKana")} />
            {errors.lastNameKana && <div style={{ color:C.red, fontSize:13, marginTop:4 }}>⚠️ {errors.lastNameKana}</div>}
          </div>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:12, color:C.gray, marginBottom:4, fontWeight:600 }}>名（ふりがな）</div>
            <RgTextInput placeholder="例：たろう" error={errors.firstNameKana} {...bind("firstNameKana")} />
            {errors.firstNameKana && <div style={{ color:C.red, fontSize:13, marginTop:4 }}>⚠️ {errors.firstNameKana}</div>}
          </div>
        </div>
      </div>

      <RgField label="📱 携帯電話番号" error={errors.phone}
        hint="ログイン時の確認に使用します">
        <RgTextInput type="tel" placeholder="例：090-1234-5678" {...bind("phone")} />
      </RgField>

      <RgField label="📧 メールアドレス（ログインID）" error={errors.email}
        hint="このメールアドレスがログインIDになります">
        <RgTextInput type="email" placeholder="例：tanaka@example.com" {...bind("email")} />
      </RgField>

      <div style={{ background:"#f4f7ff", borderRadius:10, padding:"10px 14px",
        marginBottom:14, fontSize:12, color:"#444", lineHeight:1.9,
        border:"1px solid "+C.grayL }}>
        🔑 パスワードの条件：8文字以上・英字（大文字/小文字）を含む・数字を含む
      </div>

      <RgField label="🔑 パスワード" error={errors.password}>
        <RgPwInput value={pw}
          onChange={e=>{ setData(d=>({...d,password:e.target.value})); setErrors(er=>({...er,password:""})); }}
          error={errors.password} />
        <PwStrength pw={pw} />
      </RgField>

      <RgField label="🔑 パスワード（確認）" error={errors.confirmPw}>
        <RgPwInput value={data.confirmPw||""}
          onChange={e=>{ setData(d=>({...d,confirmPw:e.target.value})); setErrors(er=>({...er,confirmPw:""})); }}
          error={errors.confirmPw} placeholder="もう一度入力してください" />
      </RgField>

      {regError && (
        <div style={{ background:"#fff0f0", border:"2px solid #e53e3e", borderRadius:10,
          padding:"12px 14px", marginBottom:14, fontSize:14, color:"#c53030", fontWeight:600 }}>
          ⚠️ {regError}
        </div>
      )}
      <div style={{ marginBottom:12 }}>
        <RgPrimaryBtn onClick={()=>{ if(!loading && validate()) onNext(); }} disabled={loading}>
          {loading ? "登録中..." : "登録する →"}
        </RgPrimaryBtn>
      </div>
      <RgSubBtn onClick={onBack} disabled={loading}>← もどる</RgSubBtn>
    </div>
  );
}

function RegisterApp({ onDone, onBack }) {
  const [step, setStep]           = useState(0);
  const [done, setDone]           = useState(false);
  const [companyId, setCompanyId] = useState("");
  const [companyName, setCompanyName] = useState("");
  const [data, setData]           = useState({
    lastName:"", firstName:"", lastNameKana:"", firstNameKana:"",
    phone:"", email:"", password:"", confirmPw:"",
  });
  const [regLoading, setRegLoading] = useState(false);
  const [regError,   setRegError]   = useState("");

  const handleRegister = async () => {
    setRegLoading(true);
    setRegError("");
    // 1. Supabase Auth にユーザー登録
    const { data: authData, error: signUpErr } = await sb.auth.signUp({
      email:    data.email.toLowerCase(),
      password: data.password,
      options:  { data: { role: "user" } },
    });
    if (signUpErr) {
      setRegError(signUpErr.message);
      setRegLoading(false);
      return;
    }
    // 2. profiles テーブルに追加
    if (authData?.user) {
      const fullName     = (data.lastName.trim() + ' ' + data.firstName.trim()).trim();
      const fullNameKana = (data.lastNameKana.trim() + ' ' + data.firstNameKana.trim()).trim();
      const { error: profileErr } = await sb.from('profiles').insert({
        id:         authData.user.id,
        name:       fullName,
        name_kana:  fullNameKana,
        phone:      data.phone,
        company_id: companyId,
        role:       "user",
      });
      if (profileErr) console.error('[profiles insert]', profileErr.message);
    }
    setRegLoading(false);
    setDone(true);
  };

  const eliMsg = [
    <>企業IDを入力してください😊<br /><span style={{fontSize:13,color:C.gray}}>担当者より発行されたIDです</span></>,
    <>個人情報を入力してください🖊️</>,

        <div style={{ background:C.white, borderRadius:20,
          boxShadow:"0 4px 24px rgba(10,31,92,0.10)", border:"1px solid "+C.grayL }}>

          {!done ? (
            <>
              <EliRow>{eliMsg[step]}</EliRow>
              <RgStepBar step={step} />
              {step===0 && (
                <Step1 companyId={companyId} setCompanyId={setCompanyId}
                  setCompanyName={setCompanyName} onNext={()=>setStep(1)} />
              )}
              {step===1 && (
                <Step2 data={data} setData={setData} companyId={companyId}
                  companyName={companyName} onNext={handleRegister} onBack={()=>setStep(0)}
                  loading={regLoading} regError={regError} />
              )}
            </>
          ) : (
            <>
              <EliRow>登録ありがとうございます！🎉<br />メールをご確認ください</EliRow>
              <RgDone data={data} companyId={companyId} companyName={companyName} onDone={onDone} />
            </>
          )}
        </div>

        {/* 下部 */}
        <div style={{ background:C.white, borderRadius:16,

          display:"flex", overflow:"hidden", marginTop:16 }}>

            <div style={{ fontSize:12, color:C.gray, marginBottom:4 }}>📞 電話受付</div>
            <div style={{ fontSize:20, fontWeight:900, color:C.navy }}>06-6392-3882</div>

// ── 現場名サジェスト入力（Supabase sites テーブル連携） ──────
function SiteNameInput({ value, onChange, hasError, sites, onSelect }) {
  const [focused,  setFocused]  = useState(false);
  const [showList, setShowList] = useState(false);
  const wrapRef = useRef(null);

  const suggestions = value.length > 0
    ? (sites||[]).filter(s => s.site_name.includes(value) && s.site_name !== value)
    : [];

  useEffect(()=>{
    const handler = e => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setShowList(false);
    };
    document.addEventListener("mousedown", handler);
    return ()=>document.removeEventListener("mousedown", handler);
  },[]);

  const handleSelect = site => {
    onChange(site.site_name);
    if (onSelect) onSelect(site);
    setShowList(false);
  };

  return (
    <div ref={wrapRef} style={{ position:"relative" }}>
      <input
        value={value}
        onChange={e=>{ onChange(e.target.value); setShowList(true); }}
        onFocus={()=>{ setFocused(true); setShowList(true); }}
        onBlur={()=>setFocused(false)}
        placeholder="例：〇〇マンション101号室"
        style={{ width:"100%", fontSize:16, padding:"13px 16px", borderRadius:12,
          border:"2px solid "+(hasError?C.red:focused?C.blue:C.grayL),
          boxSizing:"border-box", fontFamily:"inherit", outline:"none", color:C.navy,
          background:hasError?"#fff0f0":C.white,
          boxShadow:focused?"0 0 0 4px rgba(41,82,200,0.08)":"none",
          transition:"all 0.2s" }} />

      {/* サジェストリスト */}
      {showList && suggestions.length>0 && (
        <div style={{ position:"absolute", top:"100%", left:0, right:0, zIndex:100,
          background:C.white, borderRadius:14, boxShadow:"0 8px 32px rgba(10,31,92,0.15)",
          border:"2px solid "+C.blue, marginTop:4, overflow:"hidden" }}>
          <div style={{ padding:"8px 14px 4px", fontSize:12, color:C.gray, fontWeight:600 }}>
            📋 過去の現場名
          </div>
          {suggestions.map((s,i)=>(
            <button key={i} onClick={()=>handleSelect(s)}
              style={{ display:"block", width:"100%", padding:"12px 16px",
                background:"none", border:"none", borderTop:i===0?"none":"1px solid "+C.grayL,
                textAlign:"left", fontSize:16, color:C.navy, cursor:"pointer",
                fontFamily:"inherit", fontWeight:500 }}
              onMouseEnter={e=>{ e.currentTarget.style.background="#f0f5ff"; }}
              onMouseLeave={e=>{ e.currentTarget.style.background="none"; }}>
              🏢 {s.site_name}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// 時間帯パターンボタン選択（手動入力切替付き）
function TimePatternSelect({ serviceId, startTime, endTime, onChange, hasError }) {
  const patterns = TIME_PATTERNS[serviceId] || [];
  const activeIdx = patterns.findIndex(p => p.start === startTime && p.end === endTime);
  // 既存の時間値がどのパターンにも一致しない場合は手動モードで初期化
  const [isManual, setIsManual] = useState(
    activeIdx < 0 && (!!startTime || !!endTime)
  );

  const handlePattern = (p) => {
    setIsManual(false);
    onChange({ startTime:p.start, endTime:p.end });
  };
  const handleManual = () => {
    setIsManual(true);
    onChange({ startTime:"", endTime:"" });
  };

  const nothingSelected = !isManual && activeIdx < 0;
  return (
    <div style={{ marginBottom:14 }}>
      <div style={{ fontSize:13, color:hasError?C.red:C.gray, marginBottom:8, fontWeight:600 }}>
        時間帯{hasError?" ⚠️ 必須":""}
      </div>
      <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
        {patterns.map((p, i) => {
          const active = !isManual && i === activeIdx;
          return (
            <button key={p.label} type="button"
              onClick={() => handlePattern(p)}
              style={{ flex:"1 1 auto", minWidth:0, padding:"10px 6px", borderRadius:12,
                border:"2px solid "+(active?C.blue:hasError&&nothingSelected?C.red:C.grayL),
                background:active?C.blue:hasError&&nothingSelected?"#fff0f0":C.white,
                color:active?C.white:C.navy, cursor:"pointer", fontFamily:"inherit",
                textAlign:"center", transition:"all 0.15s", outline:"none" }}>
              <div style={{ fontSize:15, fontWeight:800 }}>{p.label}</div>
              <div style={{ fontSize:11, fontWeight:500, marginTop:2,
                color:active?"rgba(255,255,255,0.8)":C.gray }}>{p.sub}</div>
            </button>
          );
        })}
        <button type="button" onClick={handleManual}
          style={{ flex:"1 1 auto", minWidth:0, padding:"10px 6px", borderRadius:12,
            border:"2px solid "+(isManual?C.navy:C.grayL),
            background:isManual?C.navy:C.white,
            color:isManual?C.white:C.navy, cursor:"pointer", fontFamily:"inherit",
            textAlign:"center", transition:"all 0.15s", outline:"none" }}>
          <div style={{ fontSize:15, fontWeight:800 }}>手動入力</div>
          <div style={{ fontSize:11, fontWeight:500, marginTop:2,
            color:isManual?"rgba(255,255,255,0.8)":C.gray }}>時間を指定</div>
        </button>
      </div>
      {isManual && (
        <div style={{ display:"flex", gap:10, alignItems:"flex-end", marginTop:10 }}>
          <TimeSelect label="開始時間" value={startTime}
            onChange={e=>onChange({ startTime:e.target.value, endTime })}
            hasError={hasError&&!startTime} />
          <div style={{ paddingBottom:14, fontSize:18, color:C.gray, fontWeight:700, flexShrink:0 }}>〜</div>
          <TimeSelect label="終了時間" value={endTime}
            onChange={e=>onChange({ startTime, endTime:e.target.value })}
            hasError={hasError&&!endTime} />
        </div>
      )}
    </div>
  );
}

function needsWorkers(serviceId) {
  return serviceId==="yousei"||serviceId==="kaitai";
}

// ── 日程カード ───────────────────────────────────────────
function ScheduleCard({ sch, idx, serviceId, onChange, onRemove, canRemove, showErrors }) {
  const toggleDetail=t=>{
    const d=sch.details||[];
    onChange({...sch,details:d.includes(t)?d.filter(x=>x!==t):[...d,t]});
  };
  const KAITAI_ITEMS=["フロアめくり","建具","間仕切り","天井","内壁","キッチン","トイレ","洗面台","UB","在来風呂","アスベストあり"];
  const SANPAI_ITEMS=["廃材回収","バッカン"];
  const SOUJI_ITEMS=["簡易清掃・家具移動","ハウスクリーニング","エアコンクリーニング","その他"];
  const YOUSEI_ITEMS=["養生","家具移動","荷上げ"];
  const detailItems=serviceId==="kaitai"?KAITAI_ITEMS
    :serviceId==="sanpai"?SANPAI_ITEMS
    :serviceId==="souji"?SOUJI_ITEMS
    :YOUSEI_ITEMS;

  const errDate=showErrors&&!sch.date;
  const errStart=showErrors&&!sch.startTime;
  const errEnd=showErrors&&!sch.endTime;
  const errWorkers=showErrors&&!sch.workers&&needsWorkers(serviceId);
  const hasAnyErr=errDate||errStart||errEnd||errWorkers;
  const kd=sch.serviceDetail||{};
  const errKaitaiDays=showErrors&&serviceId==="kaitai"&&!kd.days;
  const errKaitaiOffDays=showErrors&&serviceId==="kaitai"&&!kd.offDays;

  return (
    <div style={{ background:hasAnyErr||errKaitaiDays||errKaitaiOffDays?"#fff8f8":"#f4f7ff",
      borderRadius:16, padding:"16px", marginBottom:12,
      border:"2px solid "+(hasAnyErr||errKaitaiDays||errKaitaiOffDays?C.red:C.grayL), transition:"all 0.3s" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
        <div style={{ fontSize:15, fontWeight:800, color:C.blue }}>📅 日程 {idx+1}</div>
        {canRemove&&(
          <button onClick={onRemove} style={{ background:"#fff0f0", border:"1px solid #ffc0c0",
            color:C.red, borderRadius:8, padding:"5px 12px", fontSize:13, fontWeight:700, cursor:"pointer" }}>
            削除
          </button>
        )}
      </div>
      <div style={{ marginBottom:12 }}>
        <div style={{ fontSize:13, color:errDate?C.red:C.gray, marginBottom:5, fontWeight:600 }}>
          日付{errDate?" ⚠️ 必須":""}
        </div>
        <input type="date" value={sch.date||""}
          min={new Date().toISOString().split("T")[0]}
          onChange={e=>onChange({...sch,date:e.target.value})}
          style={{ width:"100%", fontSize:17, padding:"12px 14px", borderRadius:12,
            border:"2px solid "+(errDate?C.red:C.grayL), boxSizing:"border-box",
            fontFamily:"inherit", outline:"none", color:C.navy,
            background:errDate?"#fff0f0":C.white, transition:"all 0.2s" }} />
      </div>
      {TIME_PATTERNS[serviceId] ? (
        <TimePatternSelect serviceId={serviceId}
          startTime={sch.startTime||""} endTime={sch.endTime||""}
          onChange={({startTime,endTime})=>onChange({...sch,startTime,endTime})}
          hasError={errStart||errEnd} />
      ) : (
        <div style={{ display:"flex", gap:10, alignItems:"flex-end", marginBottom:14 }}>
          <TimeSelect label="開始時間" value={sch.startTime||""}
            onChange={e=>onChange({...sch,startTime:e.target.value})} hasError={errStart} />
          <div style={{ paddingBottom:14, fontSize:18, color:C.gray, fontWeight:700, flexShrink:0 }}>〜</div>
          <TimeSelect label="終了時間" value={sch.endTime||""}
            onChange={e=>onChange({...sch,endTime:e.target.value})} hasError={errEnd} />
        </div>
      )}
      <div style={{ marginBottom:4 }}>
        <div style={{ fontSize:13, color:C.gray, marginBottom:6, fontWeight:600 }}>作業内容</div>
        <div style={{ background:C.white, borderRadius:10, padding:"0 12px", border:"1px solid "+C.grayL }}>
          {detailItems.map(opt=>(
            <CheckBox key={opt} label={opt}
              checked={(sch.details||[]).includes(opt)}
              onChange={()=>toggleDetail(opt)}
              warn={opt==="アスベストあり"} small />
          ))}
        </div>
      </div>
      {serviceId==="yousei"&&(
        <YouseiDetail details={sch.details||[]} detail={sch.serviceDetail}
          onChange={v=>onChange({...sch,serviceDetail:v})} />
      )}
      {serviceId==="kaitai"&&(
        <KaitaiDetail details={sch.details||[]} detail={sch.serviceDetail}
          onChange={v=>onChange({...sch,serviceDetail:v})} showErrors={showErrors} />
      )}
      {serviceId==="sanpai"&&(sch.details||[]).length>0&&(
        <SanpaiDetail details={sch.details||[]} detail={sch.serviceDetail}
          onChange={v=>onChange({...sch,serviceDetail:v})} />
      )}
      {serviceId==="souji"&&(sch.details||[]).length>0&&(
        <SoujiDetail details={sch.details||[]} detail={sch.serviceDetail}
          onChange={v=>onChange({...sch,serviceDetail:v})} />
      )}
      {needsWorkers(serviceId)&&(
        <div style={{ marginTop:14, marginBottom:4 }}>
          <div style={{ fontSize:13, color:errWorkers?C.red:C.gray, marginBottom:8, fontWeight:600 }}>
            作業者数{errWorkers?" ⚠️ 必須":""}
          </div>
          <WorkersSelect value={sch.workers||""} onChange={val=>onChange({...sch,workers:val})} max={6} />
        </div>
      )}
      <div style={{ marginTop:14 }}>
        <div style={{ fontSize:13, color:C.gray, marginBottom:5, fontWeight:600 }}>メモ（任意）</div>
        <TextArea value={sch.memo||""} onChange={e=>onChange({...sch,memo:e.target.value})}
          placeholder="この日程に関する特記事項など" rows={2} />
      </div>
    </div>
  );
}

// ── STEP 1: 作業区分選択 ────────────────────────────────
function StepService({ onSelect, doneServices, onBack }) {
  return (
    <div style={{ padding:"0 16px 32px" }}>
      <EliTalk>
        {doneServices.length>0
          ? <>他に作業はありますか？<br />追加する作業をえらんでください😊</>
          : <>どんな作業をご依頼ですか？<br />タップしてえらんでください😊</>}
      </EliTalk>
      {doneServices.length>0&&(
        <div style={{ background:"#f0faf5", border:"2px solid "+C.green, borderRadius:14,
          padding:"12px 16px", marginBottom:16, fontSize:14, color:"#1a5c3a", fontWeight:600 }}>
          ✅ 追加済み：{doneServices.map(id=>SERVICES.find(s=>s.id===id)?.label).join("・")}
        </div>
      )}
      <div style={{ display:"flex", flexDirection:"column", gap:12, marginBottom:16 }}>
        {SERVICES.map(s=>{
          const done=doneServices.includes(s.id);
          return (
            <button key={s.id} onClick={()=>!done&&onSelect(s.id)} disabled={done}
              style={{ display:"flex", alignItems:"center", gap:16,
                background:done?"#f0f0f0":s.color, border:"2px solid "+(done?"#ccc":s.border),
                borderRadius:18, padding:"20px 18px", cursor:done?"not-allowed":"pointer",
                textAlign:"left", opacity:done?0.5:1,
                boxShadow:done?"none":"0 2px 10px rgba(10,31,92,0.07)", transition:"all 0.15s" }}
              onMouseEnter={e=>{ if(!done) e.currentTarget.style.transform="translateY(-2px)"; }}
              onMouseLeave={e=>{ e.currentTarget.style.transform="translateY(0)"; }}>
              <span style={{ fontSize:40, flexShrink:0 }}>{s.icon}</span>
              <div>
                <div style={{ fontSize:20, fontWeight:800, color:done?"#aaa":C.navy }}>{s.label}</div>
                {done&&<div style={{ fontSize:13, color:"#aaa", marginTop:2 }}>✅ 追加済み</div>}
              </div>
              {!done&&<span style={{ marginLeft:"auto", fontSize:22, color:C.gray }}>›</span>}
            </button>
          );
        })}
      </div>
      {doneServices.length>0&&(
        <OrBigBtn onClick={()=>onSelect(null)} color="green">✅ これで全部！確認画面へ進む</OrBigBtn>
      )}
      <OrSubBtn onClick={onBack}>← 注文履歴にもどる</OrSubBtn>
    </div>
  );
}

// ── STEP 2: 詳細入力 ────────────────────────────────────
function StepForm({ serviceId, savedData, onSubmit, onBack, isAdditional, firstSiteData, personName, personNameLoading, sitesCache }) {
  const svc=SERVICES.find(s=>s.id===serviceId);
  const init=savedData||{};
  const [siteName,  setSiteName]  = useState(init.siteName||"");
  const [zipCode,   setZipCode]   = useState(init.zipCode||"");
  const [zipLoading,setZipLoading]= useState(false);
  const [address,   setAddress]   = useState(init.address||"");
  const [addrNum,   setAddrNum]   = useState(init.addrNum||"");
  const [addrBldg,  setAddrBldg]  = useState(init.addrBldg||"");
  const [addrOk,    setAddrOk]   = useState(init.addrOk||false);
  const [siteContactName,  setSiteContactName]  = useState(init.siteContactName||"");
  const [siteContactPhone, setSiteContactPhone] = useState(init.siteContactPhone||"");
  const [keyInfo,   setKeyInfo]   = useState(init.keyInfo||{noKey:false,key:"",parking:""});
  const [schedules, setSchedules] = useState(init.schedules||[{date:"",startTime:"",endTime:"",details:[],workers:"",memo:"",serviceDetail:null}]);
  const [note,      setNote]      = useState(init.note||"");
  const [errors,    setErrors]    = useState([]);
  const [showErrors,setShowErrors]= useState(false);

  const refSiteName =useRef(null);
  const refAddress  =useRef(null);
  const refAddrNum  =useRef(null);
  const refAddrOk   =useRef(null);
  const refSchedule0=useRef(null);

  const handleSiteSelect = site => {
    setAddress(site.address           || "");
    setAddrNum(site.address_num       || "");
    setAddrBldg(site.address_bldg     || "");
    setZipCode(site.zip_code          || "");
    setSiteContactName(site.site_contact_name  || "");
    setSiteContactPhone(site.site_contact_phone || "");
    setAddrOk(true);
    setErrors([]);
  };

  const addSchedule=()=>setSchedules(s=>[...s,{date:"",startTime:"",endTime:"",details:[],workers:"",memo:"",serviceDetail:null}]);
  const rmSchedule =i=>setSchedules(s=>s.filter((_,idx)=>idx!==i));
  const updateSch  =(i,v)=>setSchedules(s=>s.map((x,idx)=>idx===i?v:x));

  const validate=()=>{
    const errs=[];
    if (!isAdditional&&!siteName)    errs.push("現場名を入力してください");
    if (!isAdditional&&!address)     errs.push("住所を入力してください");
    if (!isAdditional&&!addrNum)     errs.push("番地を入力してください");
    if (!isAdditional&&!addrOk)      errs.push("住所に間違いがないことを確認してチェックしてください");
    if (!schedules[0].date)          errs.push("日程1の日付を選択してください");
    if (!schedules[0].startTime)     errs.push("日程1の開始時間を選択してください");
    if (!schedules[0].endTime)       errs.push("日程1の終了時間を選択してください");
    if (needsWorkers(serviceId)&&!schedules[0].workers) errs.push("日程1の作業者数を選択してください");
    if (serviceId==="kaitai") {
      if (!schedules[0].serviceDetail?.days)    errs.push("工事日数を選択してください");
      if (!schedules[0].serviceDetail?.offDays) errs.push("作業に入れない日を入力してください");
    }
    return errs;
  };

  const scrollToFirst=()=>{
    if (!isAdditional) {
      if (!siteName&&refSiteName.current)  { refSiteName.current.scrollIntoView({behavior:"smooth",block:"center"}); return; }
      if (!address&&refAddress.current)    { refAddress.current.scrollIntoView({behavior:"smooth",block:"center"}); return; }
      if (!addrNum&&refAddrNum.current)    { refAddrNum.current.scrollIntoView({behavior:"smooth",block:"center"}); return; }
      if (!addrOk&&refAddrOk.current)     { refAddrOk.current.scrollIntoView({behavior:"smooth",block:"center"}); return; }
    }
    if (refSchedule0.current) refSchedule0.current.scrollIntoView({behavior:"smooth",block:"center"});
  };

  const fetchAddressByZip = async (zip) => {
    const clean = zip.replace(/[-ー−]/g, "");
    if (clean.length !== 7) return;
    setZipLoading(true);
    try {
      const res = await fetch(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${clean}`);
      const json = await res.json();
      if (json.results && json.results[0]) {
        const r = json.results[0];
        setAddress(r.address1 + r.address2 + r.address3);
        setErrors([]);
      }
    } catch(e) {}
    setZipLoading(false);
  };

  const handleNext=()=>{
    const errs=validate();
    setErrors(errs);
    setShowErrors(true);
    if (errs.length>0) { setTimeout(scrollToFirst,100); return; }
    onSubmit({siteName,address,addrNum,addrBldg,addrOk,keyInfo,schedules,note,zipCode,siteContactName,siteContactPhone});
  };

  return (
    <div style={{ padding:"0 16px 40px" }}>
      <EliTalk size={60}>{svc.icon} <b>{svc.label}</b>の詳細を入力してください✏️</EliTalk>

      {showErrors&&errors.length>0&&(
        <div style={{ background:"#fff0f0", border:"2px solid "+C.red, borderRadius:14,
          padding:"14px 16px", marginBottom:14, animation:"shake 0.4s ease" }}>
          <div style={{ fontSize:15, fontWeight:800, color:C.red, marginBottom:8 }}>
            ⚠️ 入力に不備があります（{errors.length}件）
          </div>
          {errors.map((e,i)=>(
            <div key={i} style={{ fontSize:14, color:C.red, marginBottom:3, display:"flex", gap:6 }}>
              <span>•</span>{e}
            </div>
          ))}
        </div>
      )}

      {/* 担当者 */}
      <Card>
        <CardTitle icon="👤">担当者</CardTitle>
        <div style={{ padding:"14px 18px" }}>
          <div style={{ fontSize:16, fontWeight:700, color:C.navy,
            background:C.grayPale, borderRadius:10, padding:"12px 16px" }}>
            {personNameLoading ? "（取得中）" : (personName || "…")}
            {!personNameLoading && <span style={{ fontSize:12, fontWeight:400, color:C.gray, marginLeft:6 }}>（ログイン情報から自動入力）</span>}
          </div>
        </div>
      </Card>

      {/* 現場情報 */}
      {!isAdditional ? (
        <Card>
          <CardTitle icon="📍">現場情報</CardTitle>
          <div style={{ padding:"14px 18px" }}>
            <div ref={refSiteName} style={{ marginBottom:14 }}>
              <div style={{ fontSize:15, fontWeight:700,
                color:showErrors&&!siteName?C.red:C.navy, marginBottom:8 }}>
                現場名 <span style={{ color:C.red, fontSize:13 }}>※必須</span>
                {showErrors&&!siteName&&<span style={{ fontSize:13, marginLeft:6 }}>⚠️</span>}
              </div>
              {/* サジェスト付き現場名入力 */}
              <SiteNameInput value={siteName}
                onChange={v=>{ setSiteName(v); setErrors([]); }}
                hasError={showErrors&&!siteName}
                sites={sitesCache||[]}
                onSelect={handleSiteSelect} />
              <div style={{ fontSize:12, color:C.gray, marginTop:5 }}>
                💡 過去に登録した現場名が候補に表示されます
              </div>
            </div>
            <div style={{ marginBottom:14 }}>
              <div style={{ fontSize:15, fontWeight:700, color:C.navy, marginBottom:8 }}>
                郵便番号
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <input value={zipCode}
                  onChange={e=>{
                    const v=e.target.value;
                    setZipCode(v);
                    fetchAddressByZip(v);
                  }}
                  placeholder="例：5900001（ハイフンなし可）"
                  maxLength={8}
                  style={{ flex:1, fontSize:16, padding:"13px 16px", borderRadius:12,
                    border:"2px solid "+C.grayL, boxSizing:"border-box",
                    fontFamily:"inherit", outline:"none", color:C.navy, background:C.white }} />
                {zipLoading&&<span style={{ fontSize:13, color:C.gray }}>検索中…</span>}
              </div>
              <div style={{ fontSize:12, color:C.gray, marginTop:5 }}>
                💡 7桁入力で住所を自動入力します
              </div>
            </div>
            <div ref={refAddress} style={{ marginBottom:14 }}>
              <div style={{ fontSize:15, fontWeight:700,
                color:showErrors&&!address?C.red:C.navy, marginBottom:8 }}>
                住所 <span style={{ color:C.red, fontSize:13 }}>※必須</span>
                {showErrors&&!address&&<span style={{ fontSize:13, marginLeft:6 }}>⚠️</span>}
              </div>
              <OrTxtInput value={address} onChange={e=>{ setAddress(e.target.value); setErrors([]); }}
                placeholder="例：大阪府堺市北区〇〇町" hasError={showErrors&&!address} />
            </div>
            <div ref={refAddrNum} style={{ marginBottom:14 }}>
              <div style={{ fontSize:15, fontWeight:700,
                color:showErrors&&!addrNum?C.red:C.navy, marginBottom:8 }}>
                番地 <span style={{ color:C.red, fontSize:13 }}>※必須</span>
                {showErrors&&!addrNum&&<span style={{ fontSize:13, marginLeft:6 }}>⚠️</span>}
              </div>
              <OrTxtInput value={addrNum} onChange={e=>{ setAddrNum(e.target.value); setErrors([]); }}
                placeholder="例：3-5-10" hasError={showErrors&&!addrNum} />
            </div>
            <div style={{ marginBottom:14 }}>
              <div style={{ fontSize:15, fontWeight:700, color:C.navy, marginBottom:8 }}>
                建物名・部屋番号 <span style={{ fontSize:13, color:C.gray, fontWeight:400 }}>任意</span>
              </div>
              <OrTxtInput value={addrBldg} onChange={e=>setAddrBldg(e.target.value)}
                placeholder="例：〇〇マンション301号室" hasError={false} />
            </div>
            <div ref={refAddrOk}
              style={{ background:addrOk?"#f0faf5":showErrors&&!addrOk?"#fff0f0":C.yellowL,
                border:"2px solid "+(addrOk?C.green:showErrors&&!addrOk?C.red:"#f5c842"),
                borderRadius:14, padding:"14px 16px", marginBottom:14, transition:"all 0.3s" }}>
              <label style={{ display:"flex", alignItems:"center", gap:14, cursor:"pointer" }}>
                <div style={{ width:30, height:30, borderRadius:8, flexShrink:0,
                  border:"2px solid "+(addrOk?C.green:showErrors&&!addrOk?C.red:"#f5c842"),
                  background:addrOk?C.green:C.white,
                  display:"flex", alignItems:"center", justifyContent:"center", transition:"all 0.2s" }}>
                  {addrOk&&<span style={{ color:C.white, fontSize:18, fontWeight:900 }}>✓</span>}
                </div>
                <input type="checkbox" checked={addrOk}
                  onChange={e=>{ setAddrOk(e.target.checked); setErrors([]); }} style={{ display:"none" }}/>

// ── 画像圧縮ユーティリティ ──────────────────────────────
async function compressImage(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const MAX_DIM = 1920, MAX_BYTES = 1 * 1024 * 1024;
        let w = img.width, h = img.height;
        if (w > MAX_DIM || h > MAX_DIM) {
          if (w > h) { h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
          else       { w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
        }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        const tryQ = q => cv.toBlob(blob => {
          if (blob.size <= MAX_BYTES || q <= 0.3) resolve(blob);
          else tryQ(Math.round((q - 0.1) * 10) / 10);
        }, 'image/jpeg', q);
        tryQ(0.85);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function OrImagePicker({ images, onChange }) {
  const [busy, setBusy] = useState(false);
  const pick = async e => {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    setBusy(true);
    try {
      const newImgs = await Promise.all(files.map(async f => {
        const blob = await compressImage(f);
        const url  = URL.createObjectURL(blob);
        const name = f.name.replace(/\.[^.]+$/, '.jpg');
        return { blob, url, name };
      }));
      onChange([...images, ...newImgs]);
    } finally { setBusy(false); e.target.value = ''; }
  };
  const remove = i => {
    URL.revokeObjectURL(images[i].url);
    onChange(images.filter((_, j) => j !== i));
  };
  return (
    <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"flex-start" }}>
      {images.map((img, i) => (
        <div key={i} style={{ position:"relative" }}>
          <img src={img.url} alt=""
            style={{ width:76, height:76, objectFit:"cover", borderRadius:8,
              border:"1px solid "+C.grayL, display:"block" }} />
          <button onClick={() => remove(i)}
            style={{ position:"absolute", top:-7, right:-7, width:22, height:22,
              background:C.red, color:"white", border:"none", borderRadius:"50%",
              cursor:"pointer", fontSize:14, fontWeight:900, padding:0,
              display:"flex", alignItems:"center", justifyContent:"center" }}>
            ×
          </button>
          <div style={{ fontSize:10, color:C.gray, textAlign:"center", marginTop:2 }}>
            {(img.blob.size/1024).toFixed(0)}KB
          </div>
        </div>
      ))}
      <label style={{ width:76, height:76, border:"2px dashed "+C.blue, borderRadius:8,
        display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
        cursor:busy?"default":"pointer", color:C.blue, flexShrink:0, opacity:busy?0.5:1 }}>
        {busy
          ? <div style={{ fontSize:11, textAlign:"center" }}>圧縮中…</div>
          : <><span style={{ fontSize:26 }}>📷</span><span style={{ fontSize:10, fontWeight:700 }}>追加</span></>}
        <input type="file" accept="image/*" multiple onChange={pick}
          disabled={busy} style={{ display:"none" }} />
      </label>
    </div>
  );
}

// Storageの署名付きURLで画像を表示（Public/Privateバケット両対応）
function SignedImage({ path, onClickUrl, style }) {
  const [url, setUrl] = useState("");
  useEffect(() => {
    sb.storage.from('order-images').createSignedUrl(path, 3600)
      .then(({ data, error }) => {
        if (error) { console.error('[SignedImage]', path, error.message); return; }
        if (data?.signedUrl) setUrl(data.signedUrl);
      });
  }, [path]);
  if (!url) return (
    <div style={{ ...style, background:C.grayL, display:"flex",
      alignItems:"center", justifyContent:"center", fontSize:11, color:C.gray, flexShrink:0 }}>
      読込中
    </div>
  );
  return (
    <img src={url} alt=""
      onClick={() => onClickUrl && onClickUrl(url)}
      style={style}
      onMouseEnter={e => { e.currentTarget.style.opacity = "0.8"; }}
      onMouseLeave={e => { e.currentTarget.style.opacity = "1"; }} />
  );
}

    setOrders(newOrders);
    setSavedForms(f=>({...f,[currentSvc]:finalData}));
    if (!doneServices.includes(currentSvc)) setDoneServices(d=>[...d,currentSvc]);
    setPhase("confirm");
  };

  const saveToSupabase = async (ordersList, images) => {
    // stale closure を避けるため state の userId は使わず直接取得
    const { data: { user: currentUser } } = await sb.auth.getUser();
    console.log('[saveToSupabase] userId:', currentUser?.id ?? null);
    if (!currentUser) throw new Error('ログインセッションが切れています。再度ログインしてください。');
    const currentUserId = currentUser.id;

    // profiles 行が存在しない場合は自動作成（登録時の insert 失敗を補完）
    const { data: existingProfile } = await sb.from('profiles')
      .select('id').eq('id', currentUserId).maybeSingle();
    if (!existingProfile) {
      const { error: profileCreateErr } = await sb.from('profiles').upsert(
        { id: currentUserId, name: personName || '', name_kana: personNameKana || '', company_id: companyId || null, role: 'user' },
        { onConflict: 'id', ignoreDuplicates: true }
      );
      if (profileCreateErr) console.error('[profiles 自動作成]', profileCreateErr.message);
    }

    const ids = [];
    for (const order of ordersList) {
      const svc = SERVICES.find(s => s.id === order.serviceId);
      const d   = order.data;
      const { data: newOrder, error } = await sb.from('orders').insert({
        user_id:        currentUserId,
        company_id:     companyId        || null,
        person_kana:    personNameKana   || '',
        service:        svc.label,
        site:           d.siteName  || '',
        address:        d.address   || '',
        key_info:       d.keyInfo?.noKey ? '在宅' : (d.keyInfo?.key || ''),
        parking:        d.keyInfo?.parking || '',
        note:           d.note      || '',
        service_detail: d,
      }).select('id').single();
      if (error) throw error;
      if (d.schedules?.length) {
        await sb.from('schedules').insert(
          d.schedules.map((sch, i) => ({
            order_id:   newOrder.id,
            work_date:  sch.date       || null,
            start_time: sch.startTime  || '',
            end_time:   sch.endTime    || '',
            workers:    sch.workers    || '',
            details:    sch.details    || [],
            sort_order: i,
          }))
        );
      }
      for (let i = 0; i < images.length; i++) {
        const img  = images[i];
        // 特殊文字・日本語を含むファイル名はアップロード失敗の原因になるため連番JPEGに統一
        const path = `${newOrder.id}/${i}.jpg`;
        const { error: upErr } = await sb.storage.from('order-images')
          .upload(path, img.blob, { contentType:'image/jpeg', upsert:true });
        if (upErr) {
          console.error('[画像アップロード失敗]', upErr.message);
          throw new Error(`画像のアップロードに失敗しました: ${upErr.message}`);
        }
        const { error: dbErr } = await sb.from('order_images')
          .insert({ order_id:newOrder.id, path:path });
        if (dbErr) {
          console.error('[order_images 登録失敗]', dbErr.message);
          throw new Error(`画像情報の保存に失敗しました: ${dbErr.message}`);
        }
      }
      await sb.from('messages').insert({
        order_id:  newOrder.id,
        from_role: 'eli',
        text:      '受け付けました！\n24時間以内に担当者よりご連絡いたします。\nしばらくお待ちください。',
      });
      ids.push(newOrder.id);
    }
    // 現場情報を sites テーブルに upsert（同企業・同現場名なら更新）
    if (ordersList[0] && companyId) {
      const d = ordersList[0].data;
      if (d.siteName) {
        const { error: upsertError } = await sb.from('sites').upsert({
          company_id:          companyId,
          site_name:           d.siteName,
          address:             d.address           || '',
          address_num:         d.addrNum           || '',
          address_bldg:        d.addrBldg          || '',
          zip_code:            d.zipCode           || '',
          site_contact_name:   d.siteContactName   || '',
          site_contact_phone:  d.siteContactPhone  || '',
        }, { onConflict: ['company_id', 'site_name'] });
        if (upsertError) throw upsertError;
        // ローカルキャッシュも更新
        setSitesCache(prev => {
          const exists = prev.some(s => s.site_name === d.siteName);
          if (exists) return prev.map(s => s.site_name === d.siteName
            ? {...s, address:d.address, address_num:d.addrNum, address_bldg:d.addrBldg, zip_code:d.zipCode, site_contact_name:d.siteContactName||'', site_contact_phone:d.siteContactPhone||''}
            : s);
          return [...prev, {site_name:d.siteName, address:d.address||'', address_num:d.addrNum||'', address_bldg:d.addrBldg||'', zip_code:d.zipCode||'', site_contact_name:d.siteContactName||'', site_contact_phone:d.siteContactPhone||''}];
        });
      }
    }
    return ids;
  };

  const handleActualSubmit = async (ordersList) => {
    setSubmitting(true);
    // 呼び出し時点のimagesを引数として渡してstaleクローズャ問題を回避
    const images = attachedImages;
    try {
      const ids = await saveToSupabase(ordersList, images);
      setSavedIds(ids);
      setPhase("done");
    } catch(e) {
      alert('送信エラーが発生しました。\n\n' + e.message);
      console.error(e);
    } finally {
      setSubmitting(false);
    }
  };

  const handleSubmitAll = () => orders.length > 1 ? setPhase("finalConfirm") : handleActualSubmit(orders);
  const getTitle=()=>({service:"発注受付",form:"詳細入力",confirm:"確認画面",finalConfirm:"最終確認",done:"発注完了"}[phase]||"発注受付");

  if (phase==="done") return (
    <div style={{ background:C.bg, minHeight:"100vh", fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" }}>
      <style>{STYLE}</style>
      <OrTopBar title="発注完了"/>
      <div style={{ maxWidth:480, margin:"0 auto" }}>
        <div style={{ background:C.white, borderRadius:20, margin:"20px 16px",
          boxShadow:"0 4px 24px rgba(10,31,92,0.10)", border:"1px solid "+C.grayL }}>
          <OrDone onDone={onDone} onReset={()=>{ setPhase("service"); setCurrentSvc(null); setDoneServices([]); setOrders([]); setSavedForms({}); setSavedIds([]); }} orderId={savedIds[0]} />
        </div>
      </div>
    </div>
  );

  return (
    <div style={{ background:C.bg, minHeight:"100vh",
      fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" }}>
      <style>{STYLE}</style>
      <OrTopBar title={getTitle()} onBack={phase==="form" ? ()=>setPhase(doneServices.includes(currentSvc)?"confirm":"service") : undefined}/><OrStepBar phase={phase}/>
      <div style={{ maxWidth:480, margin:"0 auto" }}>
        {phase==="service"&&<StepService onSelect={handleSelectService} doneServices={doneServices} onBack={onBack}/>}
        {phase==="form"&&currentSvc&&(
          <StepForm serviceId={currentSvc}
            savedData={savedForms[currentSvc]||(doneServices.length>0&&firstSiteData
              ?{siteName:firstSiteData.siteName,address:firstSiteData.address,
                addrOk:firstSiteData.addrOk,keyInfo:firstSiteData.keyInfo}:{})}
            isAdditional={doneServices.length>0&&!doneServices.includes(currentSvc)}
            firstSiteData={firstSiteData}
            personName={personName}
            personNameLoading={personNameLoading}
            sitesCache={sitesCache}
            onSubmit={handleFormSubmit}
            onBack={()=>setPhase(doneServices.includes(currentSvc)?"confirm":"service")} />
        )}
        {phase==="confirm"&&currentSvc&&(
          <StepConfirm serviceId={currentSvc} formData={savedForms[currentSvc]}
            doneServices={doneServices}
            personName={personName}
            images={attachedImages}
            onImagesChange={setAttachedImages}
            onEdit={()=>setPhase("form")}
            onAddMore={()=>{ setCurrentSvc(null); setPhase("service"); }}
            onSubmitAll={handleSubmitAll}/>
        )}
        {phase==="finalConfirm"&&(
          <FinalConfirm orders={orders} images={attachedImages}
            onBack={()=>setPhase("confirm")} onSubmit={()=>handleActualSubmit(orders)} submitting={submitting}/>
        )}
      </div>
    </div>
  );
}

function HiStatusBadge({ status, large }) {
  const s = HI_STATUS[status] || HI_STATUS["調整中"];
  return (
    <span style={{ background:s.bg, color:s.text, border:"2px solid "+s.border,
      borderRadius:99, padding:large?"8px 16px":"5px 12px",
      fontSize:large?15:13, fontWeight:800, whiteSpace:"nowrap" }}>
      {s.icon} {status}
    </span>
  );
}

function hiGetTimer(order, nowMs) {
  if (order.status === "調整中") {
    const elapsedH = (nowMs - order.createdAt) / 3600000;
    const remainH  = 24 - elapsedH;
    if (remainH > 12) return null;
    if (remainH <= 3) return { bg:"#e63946", col:"#fff", blink:true,  label:`残り${Math.max(0,Math.ceil(remainH))}h` };
    if (remainH <= 6) return { bg:"#fb923c", col:"#fff", blink:false, label:`残り${Math.ceil(remainH)}h` };
    return               { bg:"#fff3cd", col:"#a07800", blink:false, label:`残り${Math.ceil(remainH)}h` };
  }
  if (order.status === "日程相談中") {
    const elapsedH = (nowMs - (order.statusChangedAt || order.createdAt)) / 3600000;
    if (elapsedH >= 72) return { bg:"#e63946", col:"#fff",    blink:true,  label:`${Math.floor(elapsedH)}h経過` };
    if (elapsedH >= 60) return { bg:"#c05000", col:"#fff",    blink:false, label:`${Math.floor(elapsedH)}h経過` };
    if (elapsedH >= 48) return { bg:"#fb923c", col:"#fff",    blink:false, label:`${Math.floor(elapsedH)}h経過` };
    if (elapsedH >= 36) return { bg:"#fbbf24", col:"#7c4f00", blink:false, label:`${Math.floor(elapsedH)}h経過` };
    if (elapsedH >= 24) return { bg:"#fef9c3", col:"#854d0e", blink:false, label:`${Math.floor(elapsedH)}h経過` };
    return                     { bg:"#fffde7", col:"#a07800", blink:false, label:`${Math.floor(elapsedH)}h経過` };
  }
  return null;
}

  const unreadCount = orders.reduce((acc,o)=>

    text:`調整中の案件が${adjCount}件あります。\n24時間以内に返答しますのでお待ちください😊` });

}

// ── 現場メモ・写真（sites テーブル保存、現場単位で共有） ──
function MemoSection({ order }) {
  const [memo,      setMemo]      = useState("");
  const [images,    setImages]    = useState([]); // Storage paths
  const [saving,    setSaving]    = useState(false);
  const [uploading, setUploading] = useState(false);
  const [saved,     setSaved]     = useState(false);
  const fileRef = useRef(null);

  const cid  = order.companyId;
  const site = order.site;

  useEffect(() => {
    if (!cid || !site) return;
    sb.from('sites').select('memo, images')
      .eq('company_id', cid).eq('site_name', site)
      .maybeSingle()
      .then(({ data }) => {
        if (!data) return;
        setMemo(data.memo || "");
        setImages(data.images || []);
      });
  }, [cid, site]);

  const handleSaveMemo = async () => {
    if (!cid || !site) return;
    setSaving(true);
    await sb.from('sites').update({ memo })
      .eq('company_id', cid).eq('site_name', site);
    setSaving(false);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  const handleUpload = async (e) => {
    const files = Array.from(e.target.files);
    if (!files.length || !cid || !site) return;
    setUploading(true);
    const newPaths = [];
    for (const file of files) {
      const ext  = file.name.split('.').pop() || 'jpg';
      const path = `${cid}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
      const { error } = await sb.storage.from('site-images')
        .upload(path, file, { contentType: file.type });
      if (!error) newPaths.push(path);
    }
    if (newPaths.length) {
      const updated = [...images, ...newPaths];
      await sb.from('sites').update({ images: updated })
        .eq('company_id', cid).eq('site_name', site);
      setImages(updated);
    }
    setUploading(false);
    e.target.value = '';
  };

  if (!cid || !site) return null;

  return (
    <div style={{ background:C.white, borderRadius:18, border:"1px solid "+C.grayL,
      boxShadow:"0 2px 12px rgba(10,31,92,0.07)", marginBottom:14 }}>
      <div style={{ fontSize:15, fontWeight:800, color:C.navy,
        borderBottom:"2px solid "+C.grayL, padding:"14px 18px 12px" }}>📝 現場メモ・写真</div>
      <div style={{ padding:"14px 18px" }}>
        <div style={{ fontSize:12, color:C.gray, marginBottom:8 }}>
          ※ 同じ現場の全案件で共有されます
        </div>
        <textarea value={memo} onChange={e=>{ setMemo(e.target.value); setSaved(false); }}
          placeholder="現場の注意事項・鍵の場所・連絡事項など..."
          style={{ width:"100%", minHeight:80, padding:"10px 12px", borderRadius:10,
            border:"2px solid "+C.grayL, fontSize:14, fontFamily:"inherit",
            resize:"vertical", outline:"none", color:C.navy, boxSizing:"border-box",
            lineHeight:1.7 }} />
        <button onClick={handleSaveMemo} disabled={saving}
          style={{ marginTop:8, padding:"9px 22px",
            background:saved ? C.green : C.blue, color:C.white, border:"none",
            borderRadius:10, fontSize:13, fontWeight:700,
            cursor:saving?"default":"pointer", fontFamily:"inherit",
            transition:"background 0.2s", opacity:saving?0.7:1 }}>
          {saved ? "✓ 保存しました" : saving ? "保存中..." : "💾 保存する"}
        </button>

        {images.length > 0 && (
          <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginTop:14 }}>
            {images.map((path, i) => {
              const url = sb.storage.from('site-images').getPublicUrl(path).data.publicUrl;
              return (
                <img key={i} src={url}
                  style={{ width:80, height:80, objectFit:"cover", borderRadius:8,
                    border:"1px solid "+C.grayL, cursor:"pointer" }}
                  onClick={()=>window.open(url, '_blank')} />
              );
            })}
          </div>
        )}

        <div style={{ marginTop:12 }}>
          <input ref={fileRef} type="file" accept="image/*" multiple
            style={{ display:"none" }} onChange={handleUpload} />
          <button onClick={()=>fileRef.current?.click()} disabled={uploading}
            style={{ padding:"9px 18px", background:C.white, color:C.navy,
              border:"2px solid "+C.grayL, borderRadius:10, fontSize:13, fontWeight:700,
              cursor:uploading?"default":"pointer", fontFamily:"inherit",
              opacity:uploading?0.6:1 }}>
            {uploading ? "アップロード中..." : "📷 写真を追加"}
          </button>
        </div>
      </div>
    </div>
  );
}

    <div style={{ background:C.white, borderRadius:18, border:"1px solid "+C.grayL,
      boxShadow:"0 2px 12px rgba(10,31,92,0.07)", marginBottom:14 }}>

        borderBottom:"2px solid "+C.grayL, padding:"14px 18px 12px" }}>
        {icon} {label}
      </div>
      <div style={{ padding:"14px 18px" }}>{children}</div>

}

function SiteAttachments({ paths, blobUrls }) {
  if (!paths || !paths.length) return null;
  return (
    <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginTop:10 }}>
      {paths.map((path, i) => {
        // 新規アップロード直後はblob URL、既存DBパスはpublic URL（site-imagesはpublicバケット）
        const url   = blobUrls[path] || sb.storage.from('site-images').getPublicUrl(path).data.publicUrl;
        const isPdf = /\.pdf$/i.test(path);
        if (isPdf) return (
          <a key={i} href={url} target="_blank" rel="noopener"
            style={{ width:80, height:80, border:"2px solid #f0c0c0", borderRadius:8,
              display:"flex", flexDirection:"column", alignItems:"center",
              justifyContent:"center", gap:3, textDecoration:"none",
              background:"#fff5f5", color:C.red, fontSize:9, fontWeight:700 }}>
            <span style={{ fontSize:24 }}>📄</span>PDF
          </a>
        );
        return (
          <img key={i} src={url}
            style={{ width:80, height:80, objectFit:"cover", borderRadius:8,
              border:"1px solid "+C.grayL, cursor:"pointer" }}
            onClick={()=>window.open(url,'_blank')} />
        );
      })}
    </div>
  );
}

function SiteTArea({ value, onChange, placeholder }) {

      style={{ width:"100%", minHeight:72, padding:"10px 12px", borderRadius:10,
        border:"2px solid "+C.grayL, fontSize:14, fontFamily:"inherit",

        boxSizing:"border-box", lineHeight:1.7 }} />

}

function SiteAttachBtn({ imgField, isUploading, onUpload }) {

  return (

      <input ref={ref} type="file" accept="image/*,application/pdf" multiple
        style={{ display:"none" }} onChange={onUpload} />
      <button onClick={()=>ref.current?.click()} disabled={isUploading}
        style={{ marginTop:10, padding:"8px 16px", background:C.white, color:C.navy,
          border:"2px solid "+C.grayL, borderRadius:10, fontSize:13, fontWeight:700,
          cursor:isUploading?"default":"pointer", fontFamily:"inherit",

function BottomSheet({ children }) {

      display:"flex", alignItems:"flex-end", justifyContent:"center", zIndex:1000 }}>
      <div style={{ background:C.white, borderRadius:"24px 24px 0 0",
        padding:"28px 24px 48px", width:"100%", maxWidth:480, animation:"msgIn 0.25s ease" }}>
