// ── 詳細画面（現場情報管理） ─────────────────────────────────
function DetailScreen({ role, order, onBack, onOpenChat, onStatusChange, onChat, viewOnly: initViewOnly = false }) {
  const [viewOnly,    setViewOnly]    = useState(initViewOnly);
  const [modal,       setModal]       = useState(null);
  const [reschedDate, setReschedDate] = useState("");
  const [reschedTime, setReschedTime] = useState("");
  const [reschedErr,  setReschedErr]  = useState("");

  const [siteData, setSiteData] = useState({
    key_info:'', parking_info:'',
    contact_name:'', contact_phone:'',
    memo:'', entry_info:'', yosei_info:'',
  });
  const [imagePaths, setImagePaths] = useState({
    key_images:[], parking_images:[], images:[], entry_images:[], yosei_images:[],
  });
  const [blobUrls,       setBlobUrls]       = useState({}); // アップロード直後のblob URL（セッション中保持）
  const [saving,         setSaving]         = useState(false);
  const [manualSaving,   setManualSaving]   = useState(false);
  const [savedMsg,       setSavedMsg]       = useState(false);
  const [uploadingField, setUploadingField] = useState(null);
  const saveTimer   = useRef(null);
  const blobUrlsRef = useRef({});

  useEffect(() => {
    return () => {
      clearTimeout(saveTimer.current);
      Object.values(blobUrlsRef.current).forEach(url => { try { URL.revokeObjectURL(url); } catch(e) {} });
    };
  }, []);

  const [cid, setCid] = useState(order.companyId || '');
  const siteName = order.site;
  const st       = HI_STATUS[order.status] || HI_STATUS["調整中"];
  const noReq    = ["完了","キャンセル","キャンセル相談中"];
  const canCancel     = role !== "admin" && !noReq.includes(order.status);
  const canReschedule = role !== "admin" && !noReq.includes(order.status) && order.status !== "日程変更相談中";

  // order.companyId が空の場合、ログイン中ユーザーのプロフィールから取得
  useEffect(() => {
    if (cid) return;
    sb.auth.getUser().then(({ data: { user } }) => {
      if (!user) return;
      sb.from('profiles').select('company_id').eq('id', user.id).maybeSingle()
        .then(({ data }) => { if (data?.company_id) setCid(data.company_id); });
    });
  }, []);

  const fetchSiteData = (resolvedCid) => {
    if (!resolvedCid || !siteName) return;
    sb.from('sites')
      .select('key_info,key_images,parking_info,parking_images,contact_name,contact_phone,memo,images,entry_info,entry_images,yosei_info,yosei_images')
      .eq('company_id', resolvedCid).eq('site_name', siteName)
      .limit(1)
      .then(({ data: rows, error }) => {
        if (error) { console.error('[fetchSiteData]', error.message); return; }
        const data = rows?.[0];
        if (!data) return;
        // テキスト情報のみ更新（blobUrlsは一切触らない）
        setSiteData({
          key_info:     data.key_info     || '',
          parking_info: data.parking_info || '',
          contact_name: data.contact_name || '',
          contact_phone:data.contact_phone|| '',
          memo:         data.memo         || '',
          entry_info:   data.entry_info   || '',
          yosei_info:   data.yosei_info   || '',
        });
        // 画像パスはDBパスを優先しつつ、未DB保存の新規パスを保持
        const mergeImgs = (dbImgs, prevImgs) => {
          const dbSet = new Set(dbImgs);
          return [...dbImgs, ...(prevImgs || []).filter(p => !dbSet.has(p))];
        };
        setImagePaths(prev => ({
          key_images:     mergeImgs(data.key_images     || [], prev.key_images),
          parking_images: mergeImgs(data.parking_images || [], prev.parking_images),
          images:         mergeImgs(data.images         || [], prev.images),
          entry_images:   mergeImgs(data.entry_images   || [], prev.entry_images),
          yosei_images:   mergeImgs(data.yosei_images   || [], prev.yosei_images),
        }));
      });
  };

  useEffect(() => { fetchSiteData(cid); }, [cid, siteName]);

  const handleText = (field, value) => {
    const next = { ...siteData, [field]: value };
    setSiteData(next);
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      if (!siteName) return;
      let timerCid = cid;
      if (!timerCid) {
        const { data: { user } } = await sb.auth.getUser();
        if (user) {
          const { data: prof } = await sb.from('profiles')
            .select('company_id').eq('id', user.id).maybeSingle();
          if (prof?.company_id) { timerCid = prof.company_id; setCid(timerCid); }
        }
      }
      if (!timerCid) return;
      setSaving(true);
      sb.from('sites').upsert({
        company_id:    timerCid,
        site_name:     siteName,
        key_info:      next.key_info,
        parking_info:  next.parking_info,
        contact_name:  next.contact_name,
        contact_phone: next.contact_phone,
        memo:          next.memo,
        entry_info:    next.entry_info,
        yosei_info:    next.yosei_info,
      }, { onConflict: 'company_id,site_name' })
        .then(({ error }) => { if (error) console.error('[handleText upsert]', error.message); setSaving(false); })
        .catch(e => { console.error('[handleText catch]', e.message); setSaving(false); });
    }, 1000);
  };

  const handleUpload = async (imgField, e) => {
    const files = Array.from(e.target.files);
    if (!files.length || !siteName) return;
    const activeCid = cid;
    const preExistingPaths = imagePaths[imgField] || [];

    setUploadingField(imgField);
    const savedPaths = [];

    for (const file of files) {
      const ext  = file.name.split('.').pop().toLowerCase() || 'jpg';
      const path = activeCid
        ? `${activeCid}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`
        : `local/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;

      // アップロード前にblob URLで即時表示（セッション中はそのまま保持）
      if (!/\.pdf$/i.test(ext)) {
        const blobUrl = URL.createObjectURL(file);
        blobUrlsRef.current[path] = blobUrl;
        setBlobUrls(prev => ({ ...prev, [path]: blobUrl }));
      }
      setImagePaths(prev => ({ ...prev, [imgField]: [...(prev[imgField] || []), path] }));

      if (!activeCid) { savedPaths.push(path); continue; }

      const { error } = await sb.storage.from('site-images')
        .upload(path, file, { contentType: file.type });

      if (error) {
        // アップロード失敗時のみ除去
        setImagePaths(prev => ({ ...prev, [imgField]: (prev[imgField] || []).filter(p => p !== path) }));
        setBlobUrls(prev => { const n = { ...prev }; delete n[path]; return n; });
        if (blobUrlsRef.current[path]) { URL.revokeObjectURL(blobUrlsRef.current[path]); delete blobUrlsRef.current[path]; }
      } else {
        // 成功：blob URLはセッション中そのまま保持（revokeしない）
        savedPaths.push(path);
      }
    }

    // 成功したパスのみDBに保存
    if (activeCid && savedPaths.length) {
      const dbPaths = [...preExistingPaths, ...savedPaths];
      try {
        const { error: dbErr } = await sb.from('sites').upsert({
          company_id: activeCid,
          site_name:  siteName,
          [imgField]: dbPaths,
        }, { onConflict: 'company_id,site_name' });
        if (dbErr) console.error('[sites upsert 失敗]', dbErr.message);
      } catch (e) {
        console.error('[sites upsert 失敗]', e.message);
      }
    }

    setUploadingField(null);
    e.target.value = '';
  };

  const handleSave = async () => {
    if (manualSaving) return;
    if (!siteName) return;

    // cid が未解決の場合、profilesから再取得してから保存
    let activeCid = cid;
    if (!activeCid) {
      const { data: { user } } = await sb.auth.getUser();
      if (user) {
        const { data: prof } = await sb.from('profiles')
          .select('company_id').eq('id', user.id).maybeSingle();
        if (prof?.company_id) {
          activeCid = prof.company_id;
          setCid(activeCid);
        }
      }
    }
    if (!activeCid) {
      console.error('[handleSave] company_id が取得できないため保存できません');
      return;
    }

    setManualSaving(true);
    try {
      const { error } = await sb.from('sites').upsert({
        company_id:     activeCid,
        site_name:      siteName,
        key_info:       siteData.key_info,
        key_images:     imagePaths.key_images,
        parking_info:   siteData.parking_info,
        parking_images: imagePaths.parking_images,
        contact_name:   siteData.contact_name,
        contact_phone:  siteData.contact_phone,
        memo:           siteData.memo,
        images:         imagePaths.images,
        entry_info:     siteData.entry_info,
        entry_images:   imagePaths.entry_images,
        yosei_info:     siteData.yosei_info,
        yosei_images:   imagePaths.yosei_images,
      }, { onConflict: 'company_id,site_name' });
      if (error) { console.error('[handleSave upsert]', error.message); }
      else { setSavedMsg(true); setTimeout(() => setSavedMsg(false), 2000); }
    } finally {
      setManualSaving(false);
    }
  };

  const nowStr = () => {
    const t = new Date();
    return `${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`;
  };

  const fmtTime = t => {
    if (!t) return "";
    const [hh, mm] = t.split(":");
    return mm === "00" ? `${parseInt(hh)}時` : `${parseInt(hh)}時${mm}分`;
  };

  const handleCancel = async () => {
    const nowIso = new Date().toISOString();
    await sb.from('orders').update({ status:"キャンセル相談中", status_changed_at:nowIso }).eq('id', order.id);
    await sb.from('messages').insert({
      order_id:  order.id,
      from_role: 'eli',
      text:      '【キャンセルのご依頼】\nキャンセルをご希望です。担当者よりご連絡いたします。',
    });
    onStatusChange && onStatusChange(order.id, "キャンセル相談中");
    setModal(null);
  };

  const handleReschedule = async () => {
    if (!reschedDate) { setReschedErr("日付を選択してください"); return; }
    if (!reschedTime) { setReschedErr("時間を入力してください"); return; }
    const sch = order.schedules?.[0];
    let currentSchedule = "（未設定）";
    if (sch?.date) {
      const [, m, d] = sch.date.split("-").map(Number);
      currentSchedule = `${m}月${d}日 ${fmtTime(sch.start)}〜${fmtTime(sch.end)}`;
    }
    const [, rm, rd] = reschedDate.split("-").map(Number);
    const requestedSchedule = `${rm}月${rd}日 ${fmtTime(reschedTime)}〜`;
    const nowIso = new Date().toISOString();
    await sb.from('orders').update({ status:"日程変更相談中", status_changed_at:nowIso }).eq('id', order.id);
    await sb.from('messages').insert({
      order_id:  order.id,
      from_role: 'eli',
      text:      `【日程変更のご依頼】\n日程変更をご希望です。担当者よりご連絡いたします。\n現在の日程：${currentSchedule}\nご希望の日程：${requestedSchedule}`,
    });
    onStatusChange && onStatusChange(order.id, "日程変更相談中");
    setModal(null); setReschedDate(""); setReschedTime(""); setReschedErr("");
  };


  return (
    <div style={{ background:C.bg, minHeight:"100vh", fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" }}>
      <style>{HI_CSS}</style>

      {modal === "cancel" && (
        <BottomSheet>
          <div style={{ textAlign:"center", marginBottom:24 }}>
            <div style={{ fontSize:40, marginBottom:10 }}>🚫</div>
            <div style={{ fontSize:18, fontWeight:800, color:C.navy, marginBottom:8 }}>キャンセルを依頼しますか？</div>
            <div style={{ fontSize:14, color:C.gray, lineHeight:1.9 }}>担当者へキャンセルの相談メッセージが<br/>自動で送られます。</div>
          </div>
          <button onClick={handleCancel} style={{ display:"block", width:"100%",
            background:"linear-gradient(135deg,#e63946,#b01020)", color:C.white, border:"none",
            borderRadius:14, fontSize:16, fontWeight:800, padding:"16px 0", cursor:"pointer",
            fontFamily:"inherit", marginBottom:10 }}>
            🚫 はい、キャンセルを依頼する
          </button>
          <button onClick={()=>setModal(null)} style={{ display:"block", width:"100%",
            background:C.grayPale, color:C.navy, border:"2px solid "+C.grayL,
            borderRadius:14, fontSize:15, fontWeight:700, padding:"14px 0",
            cursor:"pointer", fontFamily:"inherit" }}>もどる</button>
        </BottomSheet>
      )}

      {modal === "reschedule" && (
        <BottomSheet>
          <div style={{ marginBottom:20 }}>
            <div style={{ fontSize:18, fontWeight:800, color:C.navy, marginBottom:4 }}>📆 日程変更を相談する</div>
            <div style={{ fontSize:14, color:C.gray }}>ご希望の日時を入力してください</div>
          </div>
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:13, color:C.gray, fontWeight:700, marginBottom:6 }}>変更希望日</div>
            <input type="date" value={reschedDate} min={new Date().toISOString().split("T")[0]}
              onChange={e=>{ setReschedDate(e.target.value); setReschedErr(""); }}
              style={{ width:"100%", fontSize:16, padding:"12px 14px", borderRadius:10,
                border:"2px solid "+(reschedErr&&!reschedDate?C.red:C.grayL),
                fontFamily:"inherit", outline:"none", color:C.navy, boxSizing:"border-box" }} />
          </div>
          <div style={{ marginBottom:reschedErr?8:20 }}>
            <div style={{ fontSize:13, color:C.gray, fontWeight:700, marginBottom:6 }}>変更希望時間</div>
            <input type="time" value={reschedTime}
              onChange={e=>{ setReschedTime(e.target.value); setReschedErr(""); }}
              style={{ width:"100%", fontSize:16, padding:"12px 14px", borderRadius:10,
                border:"2px solid "+(reschedErr&&!reschedTime?C.red:C.grayL),
                fontFamily:"inherit", outline:"none", color:C.navy, boxSizing:"border-box" }} />
          </div>
          {reschedErr && <div style={{ color:C.red, fontSize:13, marginBottom:12 }}>⚠️ {reschedErr}</div>}
          <button onClick={handleReschedule} style={{ display:"block", width:"100%",
            background:"linear-gradient(135deg,#6930c3,#4a1f9e)", color:C.white, border:"none",
            borderRadius:14, fontSize:16, fontWeight:800, padding:"16px 0", cursor:"pointer",
            fontFamily:"inherit", marginBottom:10 }}>📆 変更を相談する</button>
          <button onClick={()=>{ setModal(null); setReschedErr(""); }} style={{ display:"block", width:"100%",
            background:C.grayPale, color:C.navy, border:"2px solid "+C.grayL,
            borderRadius:14, fontSize:15, fontWeight:700, padding:"14px 0",
            cursor:"pointer", fontFamily:"inherit" }}>もどる</button>
        </BottomSheet>
      )}

      <div style={{ background:C.white, borderBottom:"2px solid "+C.grayL,
        padding:"14px 20px", display:"flex", alignItems:"center", gap:12,
        boxShadow:"0 2px 8px rgba(10,31,92,0.06)" }}>
        <button onClick={onBack} style={{ background:C.grayPale, border:"none",
          borderRadius:10, padding:"8px 14px", fontSize:14, fontWeight:700,
          color:C.navy, cursor:"pointer", fontFamily:"inherit" }}>← もどる</button>
        <img src={LOGO_IMG} style={{ height:54, objectFit:"contain" }} />
        <div style={{ flex:1, textAlign:"right" }}>
          {viewOnly
            ? <span style={{ fontSize:14, fontWeight:800, color:C.navy }}>案件詳細</span>
            : saving
              ? <span style={{ fontSize:12, color:C.gray }}>💾 保存中...</span>
              : <span style={{ fontSize:14, fontWeight:800, color:C.navy }}>現場情報</span>
          }
        </div>
      </div>

      <div className="hi-main-content">

        <div style={{ background:"linear-gradient(135deg,#0a1f5c,#1a3a8f)",
          borderRadius:18, padding:"18px 20px", marginBottom:16 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
            <div>
              <div style={{ fontSize:11, color:"rgba(255,255,255,0.6)", marginBottom:2 }}>受付番号</div>
              <div style={{ fontSize:17, fontWeight:800, color:C.white }}>{order.id}</div>
            </div>
            <HiStatusBadge status={order.status} large />
          </div>
          <div style={{ fontSize:13, color:"rgba(255,255,255,0.75)", marginTop:4 }}>{st.icon} {st.desc}</div>
          {role === "admin" && (() => { const t = hiGetTimer(order, Date.now()); return t ? (
            <div style={{ marginTop:8 }}>
              <span style={{ background:t.bg, color:t.col, borderRadius:99,
                padding:"4px 12px", fontSize:13, fontWeight:700, display:"inline-block",
                animation:t.blink?"hiBlink 0.8s ease-in-out infinite":"none" }}>
                ⏱ {t.label}
              </span>
            </div>
          ) : null; })()}
        </div>

        {role === "admin" && (
          <div style={{ background:C.white, borderRadius:18, border:"1px solid "+C.grayL,
            boxShadow:"0 2px 12px rgba(10,31,92,0.07)", marginBottom:16, padding:"14px 18px" }}>
            <div style={{ fontSize:13, color:C.gray, marginBottom:10, fontWeight:700 }}>ステータスを変更</div>
            <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
              {Object.entries(HI_STATUS).map(([key, s]) => {
                const active = order.status === key;
                return (
                  <button key={key}
                    onClick={()=>!active && onStatusChange && onStatusChange(order.id, key)}
                    style={{ padding:"7px 14px", borderRadius:99, fontSize:13, fontWeight:700,
                      border:"2px solid "+(active?s.border:C.grayL),
                      background:active?s.bg:C.white, color:active?s.text:C.gray,
                      cursor:active?"default":"pointer", transition:"all 0.15s" }}>
                    {s.icon} {key}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {viewOnly && (
          <>
            <button onClick={onOpenChat}
              style={{ width:"100%", background:"linear-gradient(135deg,#2eaa72,#1a7a50)",
                border:"none", borderRadius:16, padding:"16px 20px", cursor:"pointer",
                display:"flex", alignItems:"center", gap:14, marginBottom:12,
                boxShadow:"0 4px 16px rgba(46,170,114,0.35)", textAlign:"left" }}>
              <div style={{ width:44, height:44, background:"rgba(255,255,255,0.2)",
                borderRadius:"50%", display:"flex", alignItems:"center",
                justifyContent:"center", fontSize:24, flexShrink:0 }}>💬</div>
              <div>
                <div style={{ fontSize:16, fontWeight:900, color:C.white }}>LiBotとチャット</div>
                <div style={{ fontSize:13, color:"rgba(255,255,255,0.8)", marginTop:2 }}>担当者への連絡・日程相談はこちら</div>

function ChatScreen({ role, order, onBack }) {
  const [messages, setMessages] = useState([]);
  const [input,    setInput]    = useState("");
  const [replyTo,  setReplyTo]  = useState(null);
  const bottomRef = useRef(null);
  const isAdminRole = ['admin','manager','staff'].includes(role);
  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:"smooth"}); }, [messages]);

  useEffect(() => {
    sb.from('messages').select('*').eq('order_id', order.id).order('id')
      .then(({ data }) => { if (data) setMessages(data.map(mapChat)); });
  }, [order.id]);

  useEffect(() => {
    const oid = order.id;
    const channel = sb
      .channel(`chat-${oid}`)
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages' },
        (payload) => {
          if (payload.new.order_id === oid) {
            const msg = mapChat(payload.new);
            setMessages(prev => prev.some(m => m.id === msg.id) ? prev : [...prev, msg]);
          }
        })
      .subscribe();
    return () => sb.removeChannel(channel);
  }, [order.id]);

  useEffect(() => {
    const oid = order.id;
    const poll = async () => {
      const { data } = await sb.from('messages').select('*').eq('order_id', oid).order('id');
      if (data) setMessages(prev => {
        const rows = data.map(mapChat);
        const newOnes = rows.filter(r => !prev.some(p => p.id === r.id));
        return newOnes.length > 0 ? [...prev, ...newOnes] : prev;
      });
    };
    const timer = setInterval(poll, 3000);
    return () => clearInterval(timer);
  }, [order.id]);

  const handleSend = async () => {
    if (!input.trim()) return;
    const text = input.trim();
    const mentions = (text.match(/@\S+/g) || []).map(m => m.slice(1));
    const replyToId = replyTo?.id || null;
    setInput(""); setReplyTo(null);
    const { data: row, error } = await sb.from('messages').insert({
      order_id:   order.id,
      from_role:  isAdminRole ? 'staff' : 'user',
      text,
      reply_to_id: replyToId,
      mentions:    mentions.length > 0 ? mentions : null,
    }).select().single();
    if (error) { console.error('[ChatScreen send]', error); setInput(text); return; }
    const msg = mapChat(row);
    setMessages(prev => prev.some(m => m.id === msg.id) ? prev : [...prev, msg]);
    // LiBot自動返答（ユーザー送信かつ直前がeli以外）
    if (!isAdminRole) {
      setMessages(prev => {
        const last = prev[prev.length - 1];
        if (last?.from !== 'eli') {
          setTimeout(() => sb.from('messages').insert({
            order_id: order.id, from_role: 'eli',
            text: '受け付けました。担当者が確認次第ご連絡いたします。',
            is_read: false,
          }), 900);
        }
        return prev;
      });
    }
  };

  return (
    <div style={{ height:"100vh", display:"flex", flexDirection:"column",
      fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" }}>
      <style>{HI_CSS}</style>

      {/* ヘッダー */}
      <div style={{ background:"linear-gradient(135deg,#0a1f5c,#1a3a8f)",
        padding:"12px 16px", display:"flex", alignItems:"center", gap:10, flexShrink:0 }}>
        <button onClick={onBack} style={{ background:"rgba(255,255,255,0.15)", border:"none",
          color:C.white, borderRadius:10, padding:"8px 14px", fontSize:14,
          fontWeight:700, cursor:"pointer", fontFamily:"inherit", flexShrink:0 }}>
          ← もどる
        </button>
        <img src={ELI_IMG} className="libot-float" style={{ height:50, width:"auto", flexShrink:0 }} />
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:14, fontWeight:900, color:C.white,
            overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
            {order.site}
          </div>
          <div style={{ marginTop:2 }}><HiStatusBadge status={order.status} /></div>
        </div>
      </div>

      {/* メッセージ一覧 */}
      <div style={{ flex:1, overflowY:"auto", padding:"16px", background:C.bg }}>
        <div style={{ maxWidth:500, margin:"0 auto" }}>
          <div style={{ textAlign:"center", marginBottom:16 }}>
            <span style={{ background:C.grayPale, color:C.gray, fontSize:12,
              fontWeight:600, borderRadius:99, padding:"4px 14px", border:"1px solid "+C.grayL }}>
              受付番号：{order.id}
            </span>
          </div>

          {messages.map((msg,i)=>{
            const isOwn = isAdminRole ? msg.from==="staff" : msg.from==="user";
            const quoted = msg.replyToId ? messages.find(m => m.id === msg.replyToId) : null;
            return (
              <div key={msg.id||i} style={{
                display:"flex", flexDirection:isOwn?"row-reverse":"row",
                alignItems:"flex-end", gap:8, marginBottom:16, animation:"msgIn 0.3s ease" }}>
                {!isOwn && (
                  msg.from==="staff"
                    ? <div style={{ width:36, height:36, background:C.navy, borderRadius:"50%",
                        display:"flex", alignItems:"center", justifyContent:"center",
                        fontSize:18, flexShrink:0 }}>👷</div>
                    : <img src={ELI_IMG} className="libot-float" style={{ width:36, height:36, borderRadius:"50%", objectFit:"cover", flexShrink:0 }} />
                )}
                <div style={{ maxWidth:"78%" }}>
                  {!isOwn && msg.from==="eli"   && <div style={{ fontSize:11, color:C.gray, marginBottom:3 }}>LiBot</div>}
                  {!isOwn && msg.from==="staff" && <div style={{ fontSize:11, color:C.blue, marginBottom:3, fontWeight:600 }}>👷 担当者</div>}
                  {!isOwn && msg.from==="user" && isAdminRole && <div style={{ fontSize:11, color:C.gray, marginBottom:3 }}>👤 お客様</div>}
                  {/* 引用 */}
                  {quoted && (
                    <div style={{ background:"rgba(0,0,0,0.06)", borderLeft:"3px solid "+C.gray,
                      padding:"3px 8px", marginBottom:4, borderRadius:4,
                      fontSize:11, color:C.gray, overflow:"hidden", maxHeight:34 }}>
                      {quoted.text.slice(0,50)}{quoted.text.length>50?"…":""}
                    </div>
                  )}
                  <div style={{
                    background: isOwn ? "linear-gradient(135deg,#2952c8,#0a1f5c)"
                      : msg.from==="staff" ? "#eef3ff" : C.white,
                    color: isOwn ? C.white : C.navy,
                    borderRadius: isOwn ? "20px 4px 20px 20px" : "4px 20px 20px 20px",
                    padding:"13px 17px", fontSize:16, fontWeight:500, lineHeight:1.7,
                    boxShadow: isOwn ? "0 4px 14px rgba(10,31,92,0.2)" : "0 4px 14px rgba(10,31,92,0.07)",
                    border: !isOwn ? `1px solid ${C.grayL}` : "none",
                    whiteSpace:"pre-wrap",
                  }}>
                    {renderMentions(msg.text)}
                  </div>
                  <div style={{ display:"flex", gap:6, alignItems:"center", marginTop:4,
                    justifyContent:isOwn?"flex-end":"flex-start", flexWrap:"wrap" }}>
                    <span style={{ fontSize:11, color:C.gray }}>{msg.time}</span>
                    {msg.from !== 'eli' && (
                      <button onClick={()=>setReplyTo(msg)}
                        style={{ fontSize:10, color:C.gray, background:"none", border:"none",
                          cursor:"pointer", padding:"0 2px", fontFamily:"inherit" }}>↩ 返信</button>
                    )}
                  </div>
                </div>
              </div>
            );
          })}
          <div ref={bottomRef} />
        </div>
      </div>

      {/* 入力エリア */}
      <div style={{ background:C.white, borderTop:`2px solid ${C.grayL}`, padding:"12px 16px", flexShrink:0 }}>
        <div style={{ maxWidth:500, margin:"0 auto" }}>
          {replyTo && (
            <div style={{ background:"#eef3ff", borderLeft:`3px solid ${C.blue}`,
              padding:"5px 10px", marginBottom:8, borderRadius:8,
              display:"flex", justifyContent:"space-between", alignItems:"center", gap:8 }}>
              <div style={{ fontSize:12, color:C.navy, overflow:"hidden",
                textOverflow:"ellipsis", whiteSpace:"nowrap", flex:1 }}>
                ↩ {replyTo.text.slice(0,40)}{replyTo.text.length>40?"…":""}
              </div>
              <button onClick={()=>setReplyTo(null)}
                style={{ background:"none", border:"none", cursor:"pointer",
                  color:C.gray, fontSize:14, flexShrink:0 }}>✕</button>
            </div>
          )}
          <div style={{ display:"flex", gap:10, alignItems:"flex-end" }}>
            <textarea value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter"&&e.shiftKey){ return; } if(e.key==="Enter"){e.preventDefault(); handleSend();} }}
              placeholder="メッセージを入力... (Shift+Enterで改行)" rows={1}
              style={{ flex:1, fontSize:16, padding:"13px 16px", borderRadius:14,
                border:`2px solid ${C.grayL}`, background:C.bg, fontFamily:"inherit",
                color:C.navy, resize:"none", lineHeight:1.5, maxHeight:100, overflowY:"auto", outline:"none" }}
              onInput={e=>{ e.target.style.height="auto"; e.target.style.height=Math.min(e.target.scrollHeight,100)+"px"; }}
            />
            <button onClick={handleSend} style={{
              width:50, height:50, borderRadius:"50%", border:"none",
              background:input.trim()?"linear-gradient(135deg,#2952c8,#0a1f5c)":C.grayL,
              color:input.trim()?C.white:C.gray, fontSize:20, cursor:input.trim()?"pointer":"default",
              display:"flex", alignItems:"center", justifyContent:"center",
              flexShrink:0, transition:"all 0.15s" }}>✈️</button>
          </div>
          <div style={{ textAlign:"center", marginTop:6, fontSize:12, color:C.gray }}>
            📞 緊急の場合は 06-6392-3882 まで
          </div>
        </div>
      </div>
    </div>
  );
}

function HistoryApp({ role, onNewOrder, onMyPage, onLogout, onGoDetail, onGoDetailView, onGoChat }) {
  const [orders,     setOrders]    = useState([]);
  const [filter,     setFilter]    = useState("全て");
  const [, setTick]                = useState(0);
  const [loading,    setLoading]   = useState(true);
  const [dbError,    setDbError]   = useState(null);
  const [showPicker,   setShowPicker]   = useState(false);
  const [pickerSearch, setPickerSearch] = useState("");

  const fetchOrders = async () => {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) { setLoading(false); return; }
    const { data, error } = await sb
      .from('orders')
      .select('*, schedules(*, schedule_history(*)), order_images(*)')
      .eq('user_id', user.id)
      .is('deleted_at', null)
      .order('created_at', { ascending: false });
    if (error) { setDbError(error.message); setLoading(false); return; }
    setOrders((data || []).map(mapOrder));
    setLoading(false);
  };

  useEffect(() => { fetchOrders(); }, []);

  useEffect(() => {
    const autoComplete = (os) => {
      const nowMs = Date.now();
      let changed = false;
      const next = os.map(o => {
        if (o.status !== "日程確定" && o.status !== "日程相談中") return o;
        const sch = o.schedules && o.schedules[0];
        if (!sch) return o;
        const endDt = new Date(sch.date + "T" + (sch.end || "23:59") + ":00");
        if (endDt.getTime() < nowMs) { changed = true; return { ...o, status:"完了", statusChangedAt:nowMs }; }
        return o;
      });
      return changed ? next : os;
    };
    const id = setInterval(() => {
      setTick(n => n + 1);
      setOrders(os => autoComplete(os));
    }, 60000);
    setOrders(os => autoComplete(os));
    return () => clearInterval(id);
  }, []);

// ── パスワード変更モーダル ───────────────────────────────
function PwModal({ onClose, email }) {
  const [current, setCurrent]   = useState("");
  const [newPw, setNewPw]       = useState("");
  const [confirm, setConfirm]   = useState("");
  const [errors, setErrors]     = useState({});
  const [done, setDone]         = useState(false);
  const [saving, setSaving]     = useState(false);

  const handleSave = async () => {
    const e = {};
    if (!current)          e.current = "現在のパスワードを入力してください";
    if (newPw.length < 8)  e.newPw   = "8文字以上で入力してください";
    if (newPw !== confirm)  e.confirm = "パスワードが一致しません";
    setErrors(e);
    if (Object.keys(e).length) return;
    setSaving(true);
    const { error: signInErr } = await sb.auth.signInWithPassword({ email, password: current });
    if (signInErr) {
      setErrors({ current: "現在のパスワードが正しくありません" });
      setSaving(false);
      return;
    }
    const { error: updateErr } = await sb.auth.updateUser({ password: newPw });
    setSaving(false);
    if (updateErr) { setErrors({ newPw: updateErr.message }); return; }
    setDone(true);
  };

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(10,31,92,0.5)",
      display:"flex", alignItems:"center", justifyContent:"center",
      zIndex:200, padding:16 }}>
      <div style={{ background:C.white, borderRadius:20, width:"100%", maxWidth:440,
        maxHeight:"90vh", overflowY:"auto" }}>

        {/* モーダルヘッダー */}
        <div style={{ background:"linear-gradient(135deg,#0a1f5c,#1a3a8f)",
          borderRadius:"20px 20px 0 0", padding:"16px 20px",
          display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div style={{ fontSize:17, fontWeight:800, color:C.white }}>🔑 パスワードの変更</div>
          <button onClick={onClose} style={{ background:"rgba(255,255,255,0.15)", border:"none",
            color:C.white, width:32, height:32, borderRadius:"50%", cursor:"pointer", fontSize:18 }}>✕</button>
        </div>

        <div style={{ padding:"24px" }}>
          {!done ? (
            <>
              <PwField label="現在のパスワード" value={current}
                onChange={e=>{ setCurrent(e.target.value); setErrors(er=>({...er,current:""})); }}
                error={errors.current} placeholder="現在のパスワード" />

              <PwField label="新しいパスワード" value={newPw}
                onChange={e=>{ setNewPw(e.target.value); setErrors(er=>({...er,newPw:""})); }}
                error={errors.newPw} placeholder="8文字以上" />

              <PwField label="新しいパスワード（確認）" value={confirm}
                onChange={e=>{ setConfirm(e.target.value); setErrors(er=>({...er,confirm:""})); }}
                error={errors.confirm} placeholder="もう一度入力" />

              <div style={{ background:"#f4f7ff", borderRadius:10, padding:"10px 14px",
                marginBottom:20, fontSize:12, color:"#444", lineHeight:1.9,
                border:"1px solid "+C.grayL }}>
                🔑 8文字以上・英大文字・数字を含む
              </div>

              <div style={{ marginBottom:12 }}>
                <MyPrimaryBtn onClick={handleSave} disabled={saving}>{saving ? "変更中…" : "変更を保存する"}</MyPrimaryBtn>
              </div>
              <MySubBtn onClick={onClose}>キャンセル</MySubBtn>
            </>
          ) : (
            <div style={{ textAlign:"center", padding:"16px 0" }}>
              <div style={{ fontSize:52, marginBottom:12 }}>✅</div>
              <div style={{ fontSize:20, fontWeight:800, color:C.navy, marginBottom:8 }}>
                パスワードを変更しました！
              </div>
              <div style={{ fontSize:14, color:C.gray, marginBottom:24, lineHeight:1.8 }}>
                次回のログインから新しいパスワードをご使用ください
              </div>
              <MyPrimaryBtn onClick={onClose}>とじる</MyPrimaryBtn>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

  const [firstNameKana, setFirstNameKana] = useState("");

  const [company,       setCompany]       = useState("");
  const [companyId,     setCompanyId]     = useState("");
  const [userId,        setUserId]        = useState(null);
  const [errors,        setErrors]        = useState({});
  const [toast,         setToast]         = useState("");
  const [showPwModal,   setShowPwModal]   = useState(false);
  const [loading,       setLoading]       = useState(true);
  const [dbError,       setDbError]       = useState(null);
  const [saving,        setSaving]        = useState(false);

  useEffect(() => {
    const load = async () => {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) { setLoading(false); return; }
      setUserId(user.id);
      setEmail(user.email || "");
      const { data, error } = await sb
        .from('profiles')
        .select('name, name_kana, phone, company_id')
        .eq('id', user.id)
        .maybeSingle();
      if (error && error.code !== 'PGRST116') {
        setDbError(error.message);
        setLoading(false);
        return;
      }

      let cid = data?.company_id || "";
      const nameParts = (data?.name || "").split(" ");
      setLastName(nameParts[0] || "");
      setFirstName(nameParts.slice(1).join(" ") || "");
      const kanaParts = (data?.name_kana || "").split(" ");
      setLastNameKana(kanaParts[0] || "");
      setFirstNameKana(kanaParts.slice(1).join(" ") || "");
      setPhone(data?.phone || "");

      // company_id がプロフィールにない場合は直近の発注からフォールバック
      if (!cid) {

function mapOrder(row) {
  const schRows = (row.schedules || []).sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
  const schedules = schRows.map(s => ({
    id:      s.id,
    date:    s.work_date   || '',
    start:   s.start_time  || '',
    end:     s.end_time    || '',
    workers: s.workers     || '',
    details: Array.isArray(s.details) ? s.details : [],
    history: (s.schedule_history || [])
      .sort((a, b) => new Date(a.changed_at) - new Date(b.changed_at))
      .map(h => ({
        prevDate:  h.prev_date  || '',
        prevStart: h.prev_start || '',
        prevEnd:   h.prev_end   || '',
        changedAt: h.changed_at || '',
      })),
  }));
  const images = (row.order_images || [])
    .sort((a, b) => (a.created_at||'').localeCompare(b.created_at||''))
    .map(img => img.path);
  return {
    id:             row.id,
    company:        row.company    || '',
    companyId:      row.company_id || '',
    person:         row.person      || row.profiles?.name     || '',
    personKana:     row.person_kana || row.profiles?.name_kana || '',
    phone:          row.phone       || '',
    service:        row.service    || '',
    status:         row.status     || '調整中',
    site:           row.site       || '',
    address:        row.address    || '',
    schedules,
    key:            row.key_info   || '',
    parking:        row.parking    || '',
    note:           row.note       || '',
    images,
    createdAt: row.created_at
      ? new Date(row.created_at).getTime() : Date.now(),
    statusChangedAt: row.status_changed_at
      ? new Date(row.status_changed_at).getTime()
      : (row.created_at ? new Date(row.created_at).getTime() : Date.now()),
  };
}

function mapChat(row) {
  const timeStr = row.created_at

  return text.split(/(@\S+)/g).map((part, i) =>
    part.startsWith('@')
      ? <span key={i} style={{ background:"#dbeafe", color:"#1e40af",

  );
}

// ── タイマー計算 ─────────────────────────────────────────

// 調整中：発注から24時間
function getAdjustingLevel(createdAt) {
  const elapsed = Date.now() - createdAt;
  const remaining = 24 * 3600000 - elapsed;
  if (remaining <= 0)             return { level:"over",    remaining };
  if (remaining <= 3 * 3600000)  return { level:"danger",  remaining };
  if (remaining <= 6 * 3600000)  return { level:"warn",    remaining };
  if (remaining <= 12 * 3600000) return { level:"caution", remaining };
  return { level:"ok", remaining };
}

// 日程相談中：ステータス変更から72時間
function getNegotiatingLevel(statusChangedAt) {
  const elapsed = Date.now() - statusChangedAt;
  if (elapsed >= 72 * 3600000) return { level:"over",        elapsed };
  if (elapsed >= 60 * 3600000) return { level:"danger",      elapsed };
  if (elapsed >= 48 * 3600000) return { level:"warn",        elapsed };
  if (elapsed >= 36 * 3600000) return { level:"caution",     elapsed };
  if (elapsed >= 24 * 3600000) return { level:"caution_low", elapsed };
  return { level:"ok", elapsed };
}

function formatMs(ms) {
  const absMs = Math.abs(ms);
  const h = Math.floor(absMs / 3600000);
  const m = Math.floor((absMs % 3600000) / 60000);
  return h > 0 ? `${h}時間${m}分` : `${m}分`;
}

function formatElapsed(ms) {
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  if (h >= 24) {
    const d = Math.floor(h/24);
    const rh = h % 24;
    return rh > 0 ? `${d}日${rh}時間` : `${d}日`;
  }
  return h > 0 ? `${h}時間${m}分` : `${m}分`;
}

// レベル→スタイル（調整中用）
const ADJ_STYLES = {
  over:    { cardBg:"#ffd0d0", leftBorder:"#e63946", badgeBg:"#e63946", badgeText:"#fff", pulse:true  },
  danger:  { cardBg:"#ffe4e4", leftBorder:"#e63946", badgeBg:"#e63946", badgeText:"#fff", pulse:true  },
  warn:    { cardBg:"#fff0e0", leftBorder:"#f07800", badgeBg:"#f07800", badgeText:"#fff", pulse:false },
  caution: { cardBg:"#fff8ee", leftBorder:"#f5c800", badgeBg:"#e09000", badgeText:"#fff", pulse:false },
  ok:      { cardBg:C.white,   leftBorder:"#f5c800", badgeBg:"#8a9cc5", badgeText:"#fff", pulse:false },
};

// レベル→スタイル（日程相談中用）
const NEG_STYLES = {
  over:        { cardBg:"#ffd0d0", leftBorder:"#e63946", badgeBg:"#e63946", badgeText:"#fff", pulse:true  },
  danger:      { cardBg:"#ffe4e4", leftBorder:"#e63946", badgeBg:"#e63946", badgeText:"#fff", pulse:true  },
  warn:        { cardBg:"#fff0e0", leftBorder:"#f07800", badgeBg:"#f07800", badgeText:"#fff", pulse:false },
  caution:     { cardBg:"#fff8e0", leftBorder:"#f5c800", badgeBg:"#e09000", badgeText:"#fff", pulse:false },
  caution_low: { cardBg:"#fffbe8", leftBorder:"#f5c800", badgeBg:"#b07800", badgeText:"#fff", pulse:false },
  ok:          { cardBg:C.white,   leftBorder:"#f0a050", badgeBg:"#8a9cc5", badgeText:"#fff", pulse:false },
};

function getOrderTimer(order) {
  if (order.status === "調整中") {
    const info = getAdjustingLevel(order.createdAt);
    const st = ADJ_STYLES[info.level];
    const label = info.remaining <= 0
      ? `⏰ 期限超過 ${formatMs(info.remaining)}`
      : `⏰ 残り ${formatMs(info.remaining)}`;
    return { ...st, label, show:true };
  }
  if (order.status === "日程相談中") {
    const info = getNegotiatingLevel(order.statusChangedAt);
    const st = NEG_STYLES[info.level];
    const label = info.elapsed >= 72 * 3600000
      ? `💬 相談中 ${formatElapsed(info.elapsed)}（3日超過！）`
      : `💬 相談中 ${formatElapsed(info.elapsed)} 経過`;
    return { ...st, label, show:true };
  }
  return { show:false, cardBg:C.white, leftBorder:AD_STATUS[order.status]?.border||C.grayL, pulse:false };
}

// リアルタイム更新フック
function useTimer() {
  const [tick, setTick] = useState(0);
  useEffect(()=>{
    const t = setInterval(()=>setTick(v=>v+1), 60000);
    return ()=>clearInterval(t);
  },[]);
  return tick;
}

  const soudCount  = orders.filter(o=>o.status==="日程相談中").length;
  const reqCount   = orders.filter(o=>o.status==="キャンセル相談中"||o.status==="日程変更相談中").length;
  const overAdj    = orders.filter(o=>{
    if (o.status!=="調整中") return false;
    return getAdjustingLevel(o.createdAt).level==="over"||getAdjustingLevel(o.createdAt).level==="danger";
  }).length;
  const overSoud = orders.filter(o=>{
    if (o.status!=="日程相談中") return false;
    return getNegotiatingLevel(o.statusChangedAt).level==="over"||getNegotiatingLevel(o.statusChangedAt).level==="danger";
  }).length;

  return (
    <div style={{ width:340, background:C.white, borderRight:"2px solid "+C.grayL,
      display:"flex", flexDirection:"column", flexShrink:0, height:"100vh", overflow:"hidden" }}>

      <div style={{ background:`linear-gradient(135deg,${C.navy},#1a3a8f)`, padding:"14px 14px 10px" }}>
        <div style={{ fontSize:11, color:"rgba(255,255,255,0.6)", marginBottom:2 }}>LiBot 管理者画面</div>
        <div style={{ fontSize:17, fontWeight:900, color:C.white }}>受注一覧</div>
        <div style={{ display:"flex", gap:6, marginTop:8, flexWrap:"wrap" }}>
          {adjCount>0 && (
            <div style={{ background:"rgba(230,57,70,0.2)", border:"1px solid rgba(230,57,70,0.5)",
              borderRadius:7, padding:"4px 8px", fontSize:11, color:"#ffaaaa", fontWeight:700 }}>
              🆕 調整中 {adjCount}件{overAdj>0&&` ・ ⚠️${overAdj}件要確認`}
            </div>
          )}
          {soudCount>0 && (
            <div style={{ background:"rgba(240,120,0,0.2)", border:"1px solid rgba(240,120,0,0.5)",
              borderRadius:7, padding:"4px 8px", fontSize:11, color:"#ffcc88", fontWeight:700 }}>
              💬 日程相談中 {soudCount}件{overSoud>0&&` ・ ⚠️${overSoud}件長期`}
            </div>
          )}
          {reqCount>0 && (
            <div style={{ background:"rgba(192,32,44,0.2)", border:"1px solid rgba(192,32,44,0.5)",
              borderRadius:7, padding:"4px 8px", fontSize:11, color:"#ffaaaa", fontWeight:700,
              animation:"urgentPulse 2s ease-in-out infinite" }}>
              ⚠️ 要対応 {reqCount}件（キャンセル・日程変更依頼）
            </div>
          )}
        </div>
      </div>

      <div style={{ padding:"8px 12px", borderBottom:"1px solid "+C.grayL }}>
        <input value={search} onChange={e=>setSearch(e.target.value)}
          placeholder="🔍 現場名・会社名・受付番号で検索"
          style={{ width:"100%", fontSize:13, padding:"7px 11px", borderRadius:8,
            border:"1px solid "+C.grayL, boxSizing:"border-box", outline:"none",
            fontFamily:"inherit", color:C.navy }} />
      </div>

      <div style={{ padding:"6px 10px", borderBottom:"1px solid "+C.grayL,
        display:"flex", gap:4, flexWrap:"wrap" }}>
        {["全て",...AD_STATUS_LIST].map(s=>{
          const st=AD_STATUS[s];
          const act=filter===s;
          const cnt=s==="全て"?orders.length:orders.filter(o=>o.status===s).length;
          return (
            <button key={s} onClick={()=>setFilter(s)}
              style={{ padding:"3px 8px", borderRadius:6, fontSize:11, fontWeight:700,
                border:"1.5px solid "+(act?(st?.border||C.blue):C.grayL),
                background:act?(st?.bg||C.blueL):C.white,
                color:act?(st?.text||C.blue):C.gray, cursor:"pointer" }}>
              {s} ({cnt})
            </button>
          );
        })}
      </div>

      <Legend />

      {role !== "staff" && checkedIds.length > 0 && (
        <div style={{ padding:"6px 10px", borderBottom:"1px solid "+C.grayL }}>
          <button onClick={()=>onDeleteSelected(checkedIds)}
            style={{ width:"100%", padding:"6px 10px", fontSize:12, fontWeight:700, borderRadius:6,
              border:"1.5px solid "+C.red, background:"#ffeeee", color:C.red,
              cursor:"pointer", fontFamily:"inherit" }}>
            🗑️ 選択した {checkedIds.length}件を削除（論理削除）
          </button>
        </div>
      )}

      <div style={{ flex:1, overflowY:"auto" }}>
        {orders.length===0 ? (
          <div style={{ textAlign:"center", padding:"40px 16px", color:C.gray }}>
            <div style={{ fontSize:32, marginBottom:8 }}>📭</div>
            <div style={{ fontSize:14 }}>該当なし</div>
          </div>
        ) : orders.map(order=>(
          <AdOrderCard key={order.id} order={order}
            isSelected={selected?.id===order.id}
            isChecked={role !== "staff" && checkedIds.includes(order.id)}
            showCheckbox={role !== "staff"}
            onClick={()=>onSelect(order)}
            onToggleCheck={onToggleCheck} />
        ))}
      </div>
    </div>
  );
}

// ── 詳細パネル ───────────────────────────────────────────
function DetailPanel({ role, order, chats, onAddChat, onStatusChange, onEdit, onDelete }) {
  const [tab, setTab]             = useState("detail");
  const [chatInput, setChatInput]   = useState("");
  const [chatReplyTo, setChatReplyTo] = useState(null);
  const [editMode,    setEditMode]    = useState(false);
  const [editData,    setEditData]    = useState(null);
  const [saving,      setSaving]      = useState(false);
  const [lightboxUrl, setLightboxUrl] = useState(null);
  const [statusLogs,  setStatusLogs]  = useState([]);
  const bottomRef = useRef(null);
  useTimer();

  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:"smooth"}); },[chats, tab]);
  useEffect(()=>{ setEditMode(false); setEditData(null); setChatReplyTo(null); }, [order?.id]);
  useEffect(()=>{
    if (!order?.id) return;
    sb.from('status_logs').select('*').eq('order_id', order.id).order('changed_at')
      .then(({ data }) => setStatusLogs(data || []));
  }, [order?.id, order?.status]);
  // チャットタブを開いたとき既読登録
  useEffect(()=>{
    if (tab !== 'chat' || !order?.id) return;
    sb.auth.getUser().then(({ data: { user } }) => {
      if (user) sb.rpc('mark_messages_read', { p_order_id: order.id, p_email: user.email });
    });
  }, [tab, order?.id]);

  const startEdit = () => {
    setEditData({
      status: order.status,
      schedules: order.schedules.map(s => ({ ...s, detailsText: (s.details||[]).join('・') })),
    });
    setEditMode(true);
  };
  const cancelEdit = () => { setEditMode(false); setEditData(null); };
  const saveEdit = async () => {
    setSaving(true);
    try {
      const payload = {
        status: editData.status,
        schedules: editData.schedules.map(s => ({
          ...s,
          details: s.detailsText.split(/[・、,\n]/).map(t=>t.trim()).filter(Boolean),
        })),
      };
      await onEdit(order.id, payload);
      setEditMode(false);
      setEditData(null);
    } finally {
      setSaving(false);
    }
  };

  if (!order) return (
    <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center",
      color:C.gray, flexDirection:"column", gap:12, background:C.bg }}>
      <div style={{ fontSize:48 }}>📋</div>
      <div style={{ fontSize:18, fontWeight:700 }}>左の一覧から案件を選んでください</div>
    </div>
  );

  const timer = getOrderTimer(order);

  const handleSend = () => {
    if (!chatInput.trim()) return;
    const text = chatInput.trim();
    const mentions = (text.match(/@\S+/g) || []).map(m => m.slice(1));
    onAddChat(order.id, { from:"staff", text, replyToId: chatReplyTo?.id || null,
      mentions: mentions.length > 0 ? mentions : null });
    setChatInput(""); setChatReplyTo(null);
  };

  const prowonText = `【受付番号】${order.id}
【会社名】${order.company}
【担当者】${order.person}　${order.phone}
【作業区分】${order.service}
【現場名】${order.site}
【住所】${order.address}
【日程】${order.schedules.map(s=>`${s.date} ${s.start}〜${s.end} ${s.workers} ${(s.details||[]).join("・")}`).join(" / ")}
【鍵】${order.key||"なし"}
【駐車場】${order.parking||"なし"}
【備考】${order.note||"なし"}`;

  const Row = ({label,value,copy})=>!value?null:(
    <div style={{ display:"flex", gap:12, padding:"9px 0",
      borderBottom:"1px solid "+C.grayL, alignItems:"flex-start" }}>
      <div style={{ fontSize:13, color:C.gray, minWidth:90, flexShrink:0, paddingTop:1 }}>{label}</div>
      <div style={{ fontSize:14, fontWeight:600, color:C.navy, flex:1 }}>{value}</div>
      {copy && <CopyBtn value={value} label="コピー" />}
    </div>
  );

  // 警告バナーの内容
  const showBanner = timer.show && (timer.level==="danger"||timer.level==="over");
  const bannerText = order.status==="調整中"
    ? (timer.level==="over" ? "🚨 返答期限を超過しています！今すぐ連絡してください" : `🚨 返答期限まであとわずか！ ${timer.label}`)
    : (timer.level==="over" ? `🚨 日程相談が3日を超えました！ ${timer.label}` : `⚠️ 日程相談が長期化しています。 ${timer.label}`);

  return (
    <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden", background:C.bg }}>

      {/* ヘッダー */}
      <div style={{ background:C.white, borderBottom:"2px solid "+C.grayL,
        padding:"12px 20px", display:"flex", alignItems:"center",
        justifyContent:"space-between", gap:12, flexShrink:0 }}>
        <div style={{ minWidth:0 }}>
          <div style={{ fontSize:12, color:C.gray, marginBottom:2 }}>{order.id}</div>
          <div style={{ fontSize:17, fontWeight:900, color:C.navy,
            overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>

            {timer.show && (

                {timer.label}
              </span>
            )}
          </div>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:10, flexShrink:0 }}>
          <ADStatusBadge status={order.status} />
          {(role === "admin" || role === "manager") && (
            <select value={order.status} onChange={e=>onStatusChange(order.id, e.target.value)}

                color:C.blue, fontWeight:700, cursor:"pointer", background:C.blueL }}>
              {AD_STATUS_LIST.map(s=>(

      </div>

      {/* タブ */}
      <div style={{ background:C.white, borderBottom:"2px solid "+C.grayL,

        {[["detail","📋 詳細"],["chat","💬 チャット"],["prowon","📤 プロワン用"]].map(([key,label])=>(
          <button key={key} onClick={()=>setTab(key)}

              color:tab===key?C.blue:C.gray,
              borderBottom:tab===key?"3px solid "+C.blue:"3px solid transparent" }}>
            {label}
            {key==="chat" && (chats[order.id]||[]).filter(m=>m.from==="user").length>0 && (
              <span style={{ background:C.green, color:C.white, borderRadius:99,

            {/* 編集フォーム */}

                    <div style={{ marginTop:8, padding:"10px 14px", background:"#faf5ff", borderRadius:10, border:"1px solid #d8b4fe" }}>

                      {[...sch.history].reverse().map((h, hi) => (

                <div style={{ padding:"12px 16px", display:"flex", gap:8, flexWrap:"wrap" }}>
                  {order.images.map((path, i) => (
                    <SignedImage key={i} path={path}
                      onClickUrl={url => setLightboxUrl(url)}

// ── 企業ID管理 ───────────────────────────────────────────
function CompanyPanel({ onClose }) {
  const [companies, setCompanies] = useState([]);
  const [showAdd, setShowAdd]     = useState(false);
  const [form, setForm]           = useState({ name:"", contact:"", phone:"", email:"" });
  const [cpLoading, setCpLoading] = useState(true);
  const [addError, setAddError]   = useState("");
  const [addSaving, setAddSaving] = useState(false);

  useEffect(() => {
    sb.from('companies').select('*').order('id').then(({ data }) => {
      setCompanies(data || []);
      setCpLoading(false);
    });
  }, []);

  const genId = () => {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 紛らわしい文字(I,O,1,0)を除外
    const existing = new Set(companies.map(c => c.id));
    let id;
    do {
      id = "MK-" + Array.from({ length: 4 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
    } while (existing.has(id));
    return id;
  };

  const handleAdd = async () => {
    if (!form.name) return;
    setAddError("");
    setAddSaving(true);
    const newId = genId();
    const { data, error } = await sb.from('companies')
      .insert({ id:newId, ...form, is_active:true })
      .select().single();
    setAddSaving(false);
    if (error) {
      setAddError("登録に失敗しました: " + error.message);
      return;
    }
    if (data) setCompanies(c => [...c, data]);
    setForm({ name:"", contact:"", phone:"", email:"" });
    setShowAdd(false);
  };

  const handleToggle = async (id, currentActive) => {
    const { data } = await sb.from('companies')
      .update({ is_active: !currentActive })
      .eq('id', id)
      .select().single();
    if (data) setCompanies(cs => cs.map(c => c.id === id ? { ...c, is_active: !currentActive } : c));
  };

  const handleDelete = async (id, name) => {
    // 削除前に関連レコードの存在チェック
    // ※ RLSでSELECT拒否時はcountがnullになるため、nullは「取得失敗」として安全側（削除不可）に倒す
    const [resOrders, resProfiles, resSites] = await Promise.all([
      sb.from('orders').select('id', { count: 'exact', head: true }).eq('company_id', id),
      sb.from('profiles').select('id', { count: 'exact', head: true }).eq('company_id', id),
      sb.from('sites').select('company_id', { count: 'exact', head: true }).eq('company_id', id),
    ]);
    // countがnull（取得失敗）の場合も使用中扱いにして安全側に倒す
    const orderCount   = resOrders.count   ?? -1;
    const profileCount = resProfiles.count ?? -1;
    const siteCount    = resSites.count    ?? -1;
    const fetchFailed  = orderCount < 0 || profileCount < 0 || siteCount < 0;
    const used         = orderCount + profileCount + siteCount;
    if (fetchFailed || used > 0) {
      if (fetchFailed) {
        alert(`関連データの確認に失敗しました。\nRLSポリシーを確認してください。`);
        return;
      }
      const detail = [
        orderCount   > 0 ? `案件 ${orderCount}件`     : null,
        profileCount > 0 ? `ユーザー ${profileCount}件` : null,
        siteCount    > 0 ? `現場情報 ${siteCount}件`   : null,
      ].filter(Boolean).join('・');
      alert(`「${name}」（${id}）は使用中のため削除できません。\n関連データ：${detail}\n\n先に関連データを削除または移行してください。`);
      return;
    }
    if (!window.confirm(`「${name}」（${id}）を削除します。\nこの操作は取り消せません。`)) return;
    const { error } = await sb.from('companies').delete().eq('id', id);
    if (error) {
      alert(`削除に失敗しました: ${error.message}`);
      return;
    }
    setCompanies(cs => cs.filter(c => c.id !== id));
  };

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(10,31,92,0.5)",
      display:"flex", alignItems:"center", justifyContent:"center", zIndex:100 }}
      onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div style={{ background:C.white, borderRadius:20, width:"90%", maxWidth:800,
        maxHeight:"85vh", overflow:"hidden", display:"flex", flexDirection:"column",
        boxShadow:"0 20px 60px rgba(10,31,92,0.3)" }}>
        <div style={{ background:`linear-gradient(135deg,${C.navy},#1a3a8f)`,
          padding:"16px 24px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div style={{ fontSize:18, fontWeight:900, color:C.white }}>🏢 企業ID管理</div>
          <button onClick={onClose} style={{ background:"rgba(255,255,255,0.15)", border:"none",
            color:C.white, borderRadius:8, padding:"6px 14px", fontSize:14, fontWeight:700, cursor:"pointer" }}>
            ✕ とじる
          </button>
        </div>
        <div style={{ flex:1, overflowY:"auto", padding:"20px 24px" }}>
          <div style={{ marginBottom:16 }}>
            <button onClick={()=>setShowAdd(s=>!s)}
              style={{ background:`linear-gradient(135deg,${C.green},#1a7a50)`,
                color:C.white, border:"none", borderRadius:10, padding:"10px 20px",
                fontSize:14, fontWeight:800, cursor:"pointer" }}>
              ＋ 新しい取引先を追加・企業IDを発行
            </button>
          </div>
          {showAdd && (
            <div style={{ background:C.bg, border:"2px solid "+C.green,
              borderRadius:14, padding:"16px", marginBottom:16 }}>
              <div style={{ fontSize:14, fontWeight:800, color:C.navy, marginBottom:12 }}>📝 新規取引先情報</div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:12 }}>
                {[["会社名 ※必須","name","例：株式会社〇〇建設"],["担当者名","contact","例：田中 太郎"],
                  ["電話番号","phone","例：090-0000-0000"],["メールアドレス","email","例：tanaka@example.com"]
                ].map(([label,key,ph])=>(
                  <div key={key}>
                    <div style={{ fontSize:12, fontWeight:700, color:C.navy, marginBottom:4 }}>{label}</div>
                    <input value={form[key]} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))}
                      placeholder={ph}
                      style={{ width:"100%", fontSize:14, padding:"10px 12px", borderRadius:8,
                        border:"1px solid "+C.grayL, boxSizing:"border-box",
                        fontFamily:"inherit", outline:"none" }} />
                  </div>
                ))}
              </div>
              <div style={{ background:"#f0faf5", borderRadius:10, padding:"10px 14px",
                marginBottom:12, fontSize:13, color:"#1a5c3a" }}>
                発行される企業ID：<b style={{ fontSize:15 }}>{genId()}</b>
              </div>
              {addError && (
                <div style={{ background:"#fff0f0", border:"2px solid "+C.red, borderRadius:8,
                  padding:"10px 14px", marginBottom:12, fontSize:13, color:C.red, fontWeight:600 }}>
                  ⚠️ {addError}
                </div>
              )}
              <div style={{ display:"flex", gap:10 }}>
                <button onClick={handleAdd} disabled={addSaving}
                  style={{ background:addSaving?"#b0bec5":`linear-gradient(135deg,${C.blue},${C.navy})`,
                    color:C.white, border:"none", borderRadius:8, padding:"10px 20px",
                    fontSize:14, fontWeight:800, cursor:addSaving?"not-allowed":"pointer" }}>
                  {addSaving ? "登録中…" : "✅ 企業IDを発行する"}
                </button>
                <button onClick={()=>{ setShowAdd(false); setAddError(""); }}
                  style={{ background:C.grayPale, color:C.navy, border:"1px solid "+C.grayL,
                    borderRadius:8, padding:"10px 20px", fontSize:14, fontWeight:700, cursor:"pointer" }}>
                  キャンセル
                </button>
              </div>
            </div>
          )}
          <table style={{ width:"100%", borderCollapse:"collapse" }}>
            <thead>
              <tr style={{ background:C.navy }}>
                {["企業ID","会社名","担当者","電話番号","状態","削除"].map(h=>(
                  <th key={h} style={{ padding:"10px 14px", fontSize:13, fontWeight:700,
                    color:C.white, textAlign:"left", whiteSpace:"nowrap" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {cpLoading ? (
                <tr><td colSpan={6} style={{ textAlign:"center", padding:"24px", color:C.gray }}>読み込み中...</td></tr>
              ) : companies.length === 0 ? (
                <tr><td colSpan={6} style={{ textAlign:"center", padding:"24px", color:C.gray }}>登録された取引先がありません</td></tr>
              ) : companies.map((co,i)=>(
                <tr key={co.id} style={{ background:i%2===0?C.white:C.bg }}>
                  <td style={{ padding:"10px 14px" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <span style={{ fontSize:14, fontWeight:800, color:C.blue }}>{co.id}</span>
                      <CopyBtn value={co.id} label="コピー" />
                    </div>
                  </td>
                  <td style={{ padding:"10px 14px", fontSize:14, fontWeight:600, color:C.navy }}>{co.name}</td>
                  <td style={{ padding:"10px 14px", fontSize:13, color:C.navy }}>{co.contact}</td>
                  <td style={{ padding:"10px 14px" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                      <span style={{ fontSize:13 }}>{co.phone}</span>
                      <CopyBtn value={co.phone||''} label="コピー" />
                    </div>
                  </td>
                  <td style={{ padding:"10px 14px" }}>
                    <button onClick={()=>handleToggle(co.id, co.is_active)}
                      style={{ padding:"4px 12px", borderRadius:6, fontSize:12, fontWeight:700,
                        cursor:"pointer", border:"2px solid",
                        borderColor:co.is_active?C.green:C.red,
                        background:co.is_active?"#f0faf5":"#fff0f0",
                        color:co.is_active?C.green:C.red }}>
                      {co.is_active?"✅ 有効":"🚫 無効"}
                    </button>
                  </td>
                  <td style={{ padding:"10px 14px" }}>
                    <button onClick={()=>handleDelete(co.id, co.name)}
                      style={{ padding:"4px 12px", borderRadius:6, fontSize:12, fontWeight:700,
                        cursor:"pointer", border:"2px solid "+C.red,
                        background:"#fff0f0", color:C.red }}>
                      🗑️ 削除
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}
