function StaffPanel({ onClose }) {
  const ROLES      = ['admin', 'manager', 'staff'];
  const ROLE_LABEL = { admin:'admin', manager:'manager', staff:'staff' };
  const ROLE_COLOR = { admin:C.red, manager:C.orange, staff:C.blue };
  const EMPTY_FORM = { name:'', role:'staff', phone:'', email:'', is_active:true };

  const [list,    setList]    = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null); // null=非表示 'new'=新規 obj=編集中
  const [form,    setForm]    = useState(EMPTY_FORM);
  const [saving,  setSaving]  = useState(false);
  const [errMsg,  setErrMsg]  = useState('');

  const fetchStaff = async () => {
    const { data } = await sb.from('staff').select('*').order('created_at');
    setList(data || []);
    setLoading(false);
  };
  useEffect(() => { fetchStaff(); }, []);

  const openNew  = () => { setForm(EMPTY_FORM); setEditing('new'); setErrMsg(''); };
  const openEdit = (s) => {
    setForm({ name:s.name, role:s.role, phone:s.phone||'', email:s.email||'', is_active:s.is_active });
    setEditing(s); setErrMsg('');
  };
  const closeForm = () => { setEditing(null); setErrMsg(''); };

  const handleSave = async () => {
    if (!form.name.trim()) { setErrMsg('氏名を入力してください'); return; }
    setSaving(true); setErrMsg('');
    const payload = { ...form, name: form.name.trim() };
    const { error } = editing === 'new'
      ? await sb.from('staff').insert(payload)
      : await sb.from('staff').update(payload).eq('id', editing.id);
    setSaving(false);
    if (error) { setErrMsg('保存に失敗しました: ' + error.message); return; }
    await fetchStaff();
    closeForm();
  };

  const handleToggleActive = async (s) => {
    const { data } = await sb.from('staff').update({ is_active: !s.is_active }).eq('id', s.id).select().single();
    if (data) setList(l => l.map(x => x.id === s.id ? { ...x, is_active: !s.is_active } : x));
  };

  const handleDelete = async (s) => {
    if (!window.confirm(`「${s.name}」を削除しますか？\nこの操作は取り消せません。`)) return;
    const { error } = await sb.from('staff').delete().eq('id', s.id);
    if (error) { alert('削除に失敗しました: ' + error.message); return; }
    setList(l => l.filter(x => x.id !== s.id));
    if (editing?.id === s.id) closeForm();
  };

  const Field = ({ label, fkey, placeholder, type = 'text' }) => (
    <div style={{ marginBottom:12 }}>
      <div style={{ fontSize:12, fontWeight:700, color:C.navy, marginBottom:4 }}>{label}</div>
      <input type={type} value={form[fkey]} placeholder={placeholder}
        onChange={e => setForm(f => ({ ...f, [fkey]: e.target.value }))}
        style={{ width:'100%', fontSize:15, padding:'10px 12px', borderRadius:10,
          border:`1px solid ${C.grayL}`, fontFamily:'inherit', outline:'none',
          background:C.white, color:C.navy, boxSizing:'border-box' }} />
    </div>
  );

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(10,31,92,0.5)',
      display:'flex', alignItems:'center', justifyContent:'center', zIndex:100 }}
      onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background:C.white, borderRadius:20, width:'90%', maxWidth:760,
        maxHeight:'85vh', overflow:'hidden', display:'flex', flexDirection:'column',
        boxShadow:'0 20px 60px rgba(10,31,92,0.3)' }}>

        {/* ヘッダー */}
        <div style={{ background:`linear-gradient(135deg,${C.navy},#1a3a8f)`,
          padding:'16px 24px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <div style={{ fontSize:18, fontWeight:900, color:C.white }}>👷 スタッフ管理</div>
          <button onClick={onClose} style={{ background:'rgba(255,255,255,0.15)', border:'none',
            color:C.white, borderRadius:8, padding:'6px 14px', fontSize:14, fontWeight:700, cursor:'pointer' }}>
            ✕ とじる
          </button>
        </div>

        <div style={{ flex:1, overflowY:'auto', padding:'20px 24px' }}>

          {/* 追加ボタン */}
          {!editing && (
            <div style={{ marginBottom:16 }}>
              <button onClick={openNew}
                style={{ background:`linear-gradient(135deg,${C.green},#1a7a50)`,
                  color:C.white, border:'none', borderRadius:10, padding:'10px 20px',
                  fontSize:14, fontWeight:800, cursor:'pointer' }}>
                ＋ スタッフを追加
              </button>
            </div>
          )}

          {/* 追加・編集フォーム */}
          {editing && (
            <div style={{ background:C.bg, border:`2px solid ${editing==='new'?C.green:C.blue}`,
              borderRadius:14, padding:20, marginBottom:20 }}>
              <div style={{ fontSize:14, fontWeight:800, color:C.navy, marginBottom:16 }}>
                {editing === 'new' ? '📝 新規スタッフ登録' : '✏️ スタッフ情報を編集'}
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
                <Field label="氏名 ※必須" fkey="name" placeholder="例：田中 太郎" />
                <div style={{ marginBottom:12 }}>
                  <div style={{ fontSize:12, fontWeight:700, color:C.navy, marginBottom:4 }}>ロール</div>
                  <select value={form.role} onChange={e => setForm(f => ({ ...f, role:e.target.value }))}
                    style={{ width:'100%', fontSize:15, padding:'10px 12px', borderRadius:10,
                      border:`1px solid ${C.grayL}`, fontFamily:'inherit', outline:'none',
                      background:C.white, color:C.navy, boxSizing:'border-box' }}>
                    {ROLES.map(r => <option key={r} value={r}>{ROLE_LABEL[r]}</option>)}
                  </select>
                </div>
                <Field label="電話番号" fkey="phone" placeholder="例：090-0000-0000" type="tel" />
                <Field label="メールアドレス" fkey="email" placeholder="例：tanaka@markan.co.jp" type="email" />
              </div>
              {editing !== 'new' && (
                <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:12 }}>
                  <div style={{ fontSize:13, fontWeight:700, color:C.navy }}>有効フラグ</div>
                  <button onClick={() => setForm(f => ({ ...f, is_active: !f.is_active }))}
                    style={{ background:form.is_active?C.green:'#b0bec5', color:C.white, border:'none',
                      borderRadius:20, padding:'5px 16px', fontSize:13, fontWeight:700, cursor:'pointer' }}>
                    {form.is_active ? '✓ 有効' : '✕ 無効'}
                  </button>
                </div>
              )}
              {errMsg && <div style={{ color:C.red, fontSize:13, marginBottom:10 }}>⚠️ {errMsg}</div>}
              <div style={{ display:'flex', gap:10 }}>
                <button onClick={handleSave} disabled={saving}
                  style={{ background:`linear-gradient(135deg,${C.blue},${C.navy})`, color:C.white,
                    border:'none', borderRadius:10, padding:'10px 24px', fontSize:14, fontWeight:800,
                    cursor:saving?'not-allowed':'pointer', opacity:saving?0.7:1 }}>
                  {saving ? '保存中...' : '💾 保存する'}
                </button>
                <button onClick={closeForm}
                  style={{ background:'#eee', color:C.navy, border:'none', borderRadius:10,
                    padding:'10px 20px', fontSize:14, fontWeight:700, cursor:'pointer' }}>
                  キャンセル
                </button>
              </div>
            </div>
          )}

          {/* スタッフ一覧 */}
          {loading ? (
            <div style={{ textAlign:'center', padding:'40px 0', color:C.gray }}>読み込み中...</div>
          ) : list.length === 0 ? (
            <div style={{ textAlign:'center', padding:'40px 0', color:C.gray }}>
              スタッフが登録されていません
            </div>
          ) : (
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              {list.map(s => (
                <div key={s.id} style={{ background:s.is_active?C.white:'#f8f8f8',
                  border:`1px solid ${s.is_active?C.grayL:'#ddd'}`, borderRadius:12,
                  padding:'14px 16px', display:'flex', alignItems:'center', gap:12,
                  opacity:s.is_active?1:0.65 }}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4 }}>
                      <span style={{ fontSize:15, fontWeight:800, color:C.navy }}>{s.name}</span>
                      <span style={{ fontSize:11, fontWeight:700, color:C.white,
                        background:ROLE_COLOR[s.role]||C.gray, borderRadius:20, padding:'2px 10px' }}>
                        {ROLE_LABEL[s.role]||s.role}
                      </span>
                      {!s.is_active && (
                        <span style={{ fontSize:11, color:'#b0bec5', fontWeight:600 }}>（無効）</span>
                      )}
                    </div>
                    <div style={{ fontSize:13, color:C.gray, display:'flex', gap:16, flexWrap:'wrap' }}>
                      {s.phone && <span>📞 {s.phone}</span>}
                      {s.email && <span>📧 {s.email}</span>}
                    </div>
                  </div>
                  <div style={{ display:'flex', gap:6, flexShrink:0 }}>
                    <button onClick={() => handleToggleActive(s)}
                      style={{ fontSize:12, padding:'5px 10px', borderRadius:8, fontWeight:700, cursor:'pointer',
                        background:s.is_active?'#fff3e0':'#e8f5e9',
                        color:s.is_active?C.orange:C.green,
                        border:`1px solid ${s.is_active?'#ffe0b2':'#c8e6c9'}` }}>
                      {s.is_active ? '無効化' : '有効化'}
                    </button>
                    <button onClick={() => openEdit(s)}
                      style={{ fontSize:12, padding:'5px 10px', borderRadius:8, fontWeight:700,
                        cursor:'pointer', background:'#eef3ff', color:C.blue, border:'1px solid #c5d5f8' }}>
                      編集
                    </button>
                    <button onClick={() => handleDelete(s)}
                      style={{ fontSize:12, padding:'5px 10px', borderRadius:8, fontWeight:700,
                        cursor:'pointer', background:'#fff0f0', color:C.red, border:'1px solid #f5c0c0' }}>
                      削除
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── 削除済みパネル ──────────────────────────────────────
function DeletedPanel({ onClose, onRestore, onHardDelete }) {
  const [items,      setItems]      = useState([]);
  const [loading,    setLoading]    = useState(true);
  const [checkedIds, setCheckedIds] = useState([]);

  useEffect(() => {
    sb.from('orders').select('*, schedules(*)')
      .not('deleted_at', 'is', null)
      .order('deleted_at', { ascending: false })
      .then(({ data }) => { setItems((data||[]).map(mapOrder)); setLoading(false); });
  }, []);

  const toggle = id => setCheckedIds(prev =>
    prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);

  const removeFromList = ids =>
    setItems(is => is.filter(o => !ids.includes(o.id)));

  return (
    <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden", background:C.bg }}>
      <div style={{ background:"linear-gradient(135deg,#5a3e85,#7b5ea7)",
        padding:"14px 20px", display:"flex", alignItems:"center", gap:12, flexShrink:0 }}>
        <button onClick={onClose}
          style={{ background:"rgba(255,255,255,0.2)", border:"none", color:"white",
            borderRadius:8, padding:"6px 12px", fontSize:13, fontWeight:700,
            cursor:"pointer", fontFamily:"inherit" }}>← もどる</button>
        <div style={{ fontSize:16, fontWeight:900, color:"white", flex:1 }}>🗑️ 削除済み案件</div>
        <div style={{ fontSize:13, color:"rgba(255,255,255,0.7)" }}>{items.length}件</div>
      </div>

      {checkedIds.length > 0 && (
        <div style={{ padding:"8px 16px", background:C.white,
          borderBottom:"1px solid "+C.grayL, display:"flex", gap:8 }}>
          <button onClick={()=>onRestore(checkedIds, ids=>{removeFromList(ids); setCheckedIds([]); })}
            style={{ flex:1, padding:"8px", fontSize:13, fontWeight:700, borderRadius:8,
              border:"2px solid "+C.blue, background:C.blueL, color:C.blue,
              cursor:"pointer", fontFamily:"inherit" }}>
            ♻️ 選択{checkedIds.length}件を復元
          </button>
          <button onClick={()=>onHardDelete(checkedIds, ids=>{removeFromList(ids); setCheckedIds([]); })}
            style={{ flex:1, padding:"8px", fontSize:13, fontWeight:700, borderRadius:8,
              border:"2px solid "+C.red, background:"#ffeeee", color:C.red,
              cursor:"pointer", fontFamily:"inherit" }}>
            💥 完全削除
          </button>
        </div>
      )}

      <div style={{ flex:1, overflowY:"auto", padding:16 }}>
        {loading ? (
          <div style={{ textAlign:"center", padding:40, color:C.gray }}>読み込み中…</div>
        ) : items.length === 0 ? (
          <div style={{ textAlign:"center", padding:40, color:C.gray }}>
            <div style={{ fontSize:32, marginBottom:8 }}>✅</div>
            <div>削除済み案件はありません</div>
          </div>
        ) : items.map(o => (
          <div key={o.id}
            onClick={()=>toggle(o.id)}
            style={{ background:checkedIds.includes(o.id)?"#fff0f8":C.white,
              border:"1px solid "+(checkedIds.includes(o.id)?C.red:C.grayL),
              borderRadius:12, padding:"12px 14px", marginBottom:10,
              display:"flex", gap:10, alignItems:"center", cursor:"pointer" }}>
            <input type="checkbox" checked={checkedIds.includes(o.id)}
              onChange={()=>{}}
              style={{ cursor:"pointer", accentColor:C.red, width:15, height:15, flexShrink:0, pointerEvents:"none" }} />
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:13, fontWeight:800, color:C.navy, marginBottom:3 }}>
                {AD_SVC_ICON[o.service]} {o.site}
              </div>
              <div style={{ fontSize:12, color:C.gray }}>
                {o.company}　{o.schedules[0]?.date||""}　{o.id}
              </div>
            </div>
            <ADStatusBadge status={o.status} />
            <button
              onClick={e=>{ e.stopPropagation(); onRestore([o.id], ids=>removeFromList(ids)); }}
              style={{ flexShrink:0, padding:"5px 12px", fontSize:12, fontWeight:700,
                borderRadius:8, border:"2px solid "+C.blue, background:C.blueL,
                color:C.blue, cursor:"pointer", whiteSpace:"nowrap" }}>
              ♻️ 復元
            </button>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── メイン ───────────────────────────────────────────────
function AdminApp({ role, onLogout }) {
  const [orders,   setOrders]   = useState([]);
  const [chats,    setChats]    = useState({});
  const [loading,  setLoading]  = useState(true);
  const [dbError,  setDbError]  = useState(null);
  const [selected,   setSelected]   = useState(null);
  const [filter,     setFilter]     = useState("全て");
  const [search,     setSearch]     = useState("");
  const [showComp,    setShowComp]    = useState(false);
  const [showDeleted, setShowDeleted] = useState(false);
  const [showStaff,   setShowStaff]   = useState(false);
  const [checkedIds,  setCheckedIds]  = useState([]);

  const fetchOrders = async () => {
    const { data, error } = await sb
      .from('orders')
      .select('*, profiles(name, name_kana), schedules(*, schedule_history(*)), order_images(*)')
      .is('deleted_at', null)
      .order('created_at', { ascending: false });
    if (error) { setDbError(error.message); setLoading(false); return; }
    setOrders((data || []).map(mapOrder));
    setLoading(false);
    setDbError(null);
  };

  useEffect(() => {
    let channel;
    const init = async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session || !["admin","manager","staff"].includes(session.user.user_metadata?.role)) { onLogout(); return; }
      await fetchOrders();
      channel = sb.channel('admin-orders')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, fetchOrders)
        .subscribe();
    };
    init();
    const { data: { subscription } } = sb.auth.onAuthStateChange((_event, session) => {
      if (!session) onLogout();
    });
    return () => { if (channel) sb.removeChannel(channel); subscription.unsubscribe(); };
  }, []);

  // 選択案件のメッセージを遅延ロード + Realtime購読
  useEffect(() => {
    if (!selected) return;
    const id = selected.id;
    if (chats[id] === undefined) {
      sb.from('messages').select('*').eq('order_id', id).order('id').then(({ data }) => {
        setChats(c => ({ ...c, [id]: (data || []).map(mapChat) }));
      });
    }
    const channel = sb
      .channel(`admin-chat-${id}`)
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages' },
        (payload) => {
          if (payload.new.order_id !== id) return;
          setChats(c => {
            const existing = c[id] || [];
            const msg = mapChat(payload.new);
            if (existing.some(m => m.id === msg.id)) return c;
            return { ...c, [id]: [...existing, msg] };
          });
        })
      .subscribe((status, err) => {
        if (err) console.error('[Realtime admin-chat]', status, err);
      });
    const pollTimer = setInterval(async () => {
      const { data } = await sb.from('messages').select('*').eq('order_id', id).order('id');
      if (data) {
        setChats(c => {
          const existing = c[id] || [];
          const incoming = data.map(mapChat);
          const merged = [...existing];
          incoming.forEach(msg => {
            if (!merged.some(m => m.id === msg.id)) merged.push(msg);
          });
          if (merged.length === existing.length) return c;
          return { ...c, [id]: merged };
        });
      }
    }, 3000);
    return () => { sb.removeChannel(channel); clearInterval(pollTimer); };
  }, [selected?.id]);

  // 自動完了：日程確定 && 終了時刻超過 → 完了に変更
  useEffect(() => {
    const check = async () => {
      const { data } = await sb
        .from('orders').select('id')
        .eq('status', '日程確定');
      if (!data || data.length === 0) return;
      const ids = data.map(o => o.id);
      const { data: schData } = await sb
        .from('schedules').select('order_id, work_date, end_time')
        .in('order_id', ids).order('sort_order');
      if (!schData) return;
      const firstSch = {};
      schData.forEach(s => { if (!firstSch[s.order_id]) firstSch[s.order_id] = s; });
      const now = new Date();
      let changed = false;
      for (const id of ids) {
        const sch = firstSch[id];
        if (!sch) continue;
        const [y, mo, d] = sch.work_date.split("-").map(Number);
        const [h, m] = sch.end_time.split(":").map(Number);
        if (now > new Date(y, mo - 1, d, h, m)) {
          const nowIso = new Date().toISOString();
          await sb.from('orders').update({ status:"完了", status_changed_at:nowIso }).eq('id', id);
          changed = true;
        }
      }
      if (changed) fetchOrders();
    };
    check();
    const t = setInterval(check, 60000);
    return () => clearInterval(t);
  }, []);

  const filtered = orders
    .filter(o => filter === "全て" || o.status === filter)
    .filter(o => !search ||
      o.site.includes(search) || o.company.includes(search) ||
      o.id.includes(search) || o.person.includes(search));

  const sorted = [...filtered].sort((a, b) => {
    const priority = { "調整中":0, "キャンセル相談中":1, "日程変更相談中":1, "日程相談中":2, "日程確定":3, "完了":4, "キャンセル":5 };
    if ((priority[a.status] ?? 9) !== (priority[b.status] ?? 9)) return (priority[a.status] ?? 9) - (priority[b.status] ?? 9);
    if (a.status === "調整中") return a.createdAt - b.createdAt;
    if (a.status === "日程相談中") return a.statusChangedAt - b.statusChangedAt;
    return 0;
  });

  const handleStatusChange = async (id, newStatus) => {
    const nowIso = new Date().toISOString();
    const nowMs  = Date.now();
    const oldStatus = orders.find(o => o.id === id)?.status || "";
    await sb.from('orders').update({ status:newStatus, status_changed_at:nowIso }).eq('id', id);
    setOrders(os => os.map(o => o.id === id ? { ...o, status:newStatus, statusChangedAt:nowMs } : o));
    if (selected?.id === id) setSelected(s => ({ ...s, status:newStatus, statusChangedAt:nowMs }));
    sb.auth.getUser().then(({ data: { user } }) => {
      sb.from('status_logs').insert({ order_id:id, changed_by:user?.email||"unknown", old_status:oldStatus, new_status:newStatus });
    });
    if (newStatus === "キャンセル") {
      const { data: row } = await sb.from('messages').insert({
        order_id: id, from_role: 'eli',
        text: `【キャンセル承認のご連絡】\nキャンセルを承りました。\nまたのご依頼を心よりお待ちしております。`,
        is_read: false,
      }).select().single();
      if (row) {
        setChats(c => {
          const existing = c[id] || [];
          const newMsg = mapChat(row);
          if (existing.some(m => m.id === newMsg.id)) return c;
          return { ...c, [id]: [...existing, newMsg] };
        });
      }
    }
    if (newStatus === "日程確定") {
      const order = orders.find(o => o.id === id);
      const sch = order?.schedules?.[0];
      const DAYS = ["日","月","火","水","木","金","土"];
      const fmtT = t => { if (!t) return ""; const [hh,mm]=t.split(":"); return mm==="00"?`${parseInt(hh)}時`:`${parseInt(hh)}時${mm}分`; };
      let schText = "（未定）";
      if (sch?.date) {
        const [,m,d] = sch.date.split("-").map(Number);
        const yobi = DAYS[new Date(sch.date + "T00:00:00").getDay()];
        schText = `${m}月${d}日（${yobi}）${fmtT(sch.start)}〜${fmtT(sch.end)}`;
      }
      const msgText = `【日程確定のご連絡】\nご希望の日程で段取りができましたのでご報告させていただきます。\n\n確定日程：${schText}\n\n引き続きどうぞよろしくお願いいたします。`;
      const { data: row } = await sb.from('messages').insert({
        order_id: id, from_role: 'eli', text: msgText, is_read: false,
      }).select().single();
      if (row) {
        setChats(c => {
          const existing = c[id] || [];
          const newMsg = mapChat(row);
          if (existing.some(m => m.id === newMsg.id)) return c;
          return { ...c, [id]: [...existing, newMsg] };
        });
      }
    }
  };

  const handleDelete = async (ids) => {
    if (!window.confirm(`${ids.length}件を削除済みに移動します。\n削除済みタブから復元できます。`)) return;
    const deletedAt = new Date().toISOString();
    await sb.from('orders').update({ deleted_at: deletedAt }).in('id', ids);
    setOrders(os => os.filter(o => !ids.includes(o.id)));
    setCheckedIds(prev => prev.filter(id => !ids.includes(id)));
    if (selected && ids.includes(selected.id)) setSelected(null);
  };

  const handleRestore = async (ids, onSuccess) => {
    if (!window.confirm(`${ids.length}件を復元します。`)) return;
    await sb.from('orders').update({ deleted_at: null }).in('id', ids);
    const { data } = await sb.from('orders').select('*, schedules(*)')
      .in('id', ids).is('deleted_at', null);
    if (data) setOrders(os => [...os, ...data.map(mapOrder)]);
    onSuccess(ids);
  };

  const handleHardDelete = async (ids, onSuccess) => {
    if (!window.confirm(`${ids.length}件を完全削除します。\nこの操作は取り消せません。`)) return;
    await sb.from('messages').delete().in('order_id', ids);
    await sb.from('schedules').delete().in('order_id', ids);
    await sb.from('orders').delete().in('id', ids);
    onSuccess(ids);
  };

  const handleEdit = async (id, editData) => {
    const order = orders.find(o => o.id === id);
    const statusChanged = order && order.status !== editData.status;
    const nowMs = Date.now();
    const orderUpdate = { status: editData.status };
    if (statusChanged) orderUpdate.status_changed_at = new Date().toISOString();
    await sb.from('orders').update(orderUpdate).eq('id', id);
    if (statusChanged) {
      sb.auth.getUser().then(({ data: { user } }) => {
        sb.from('status_logs').insert({ order_id:id, changed_by:user?.email||"unknown", old_status:order.status, new_status:editData.status });
      });
    }
    const newHistoryEntries = {};
    for (const sch of editData.schedules) {
      if (sch.id) {
        const orig = order?.schedules.find(s => s.id === sch.id);
        const dateChanged = orig && (orig.date !== sch.date || orig.start !== sch.start || orig.end !== sch.end);
        if (dateChanged) {
          const nowIso = new Date().toISOString();
          await sb.from('schedule_history').insert({
            schedule_id: sch.id,
            order_id:    id,
            prev_date:   orig.date  || null,
            prev_start:  orig.start || null,
            prev_end:    orig.end   || null,
            new_date:    sch.date   || null,
            new_start:   sch.start  || null,
            new_end:     sch.end    || null,
          });
          newHistoryEntries[sch.id] = [
            ...(orig.history || []),
            { prevDate: orig.date, prevStart: orig.start, prevEnd: orig.end, changedAt: nowIso },
          ];
        }
        await sb.from('schedules').update({
          work_date:  sch.date,
          start_time: sch.start,
          end_time:   sch.end,
          workers:    sch.workers,
          details:    sch.details,
        }).eq('id', sch.id);
      }
    }
    const updatedSchedules = editData.schedules.map(({ id:sid, date, start, end, workers, details }) => {
      const orig = order?.schedules.find(s => s.id === sid);
      return { id:sid, date, start, end, workers, details,
        history: newHistoryEntries[sid] !== undefined ? newHistoryEntries[sid] : (orig?.history || []) };
    });
    setOrders(os => os.map(o => {
      if (o.id !== id) return o;
      return { ...o, status:editData.status, schedules:updatedSchedules,
        statusChangedAt: statusChanged ? nowMs : o.statusChangedAt };
    }));
    if (selected?.id === id) {
      setSelected(s => ({ ...s, status:editData.status, schedules:updatedSchedules,
        statusChangedAt: statusChanged ? nowMs : s.statusChangedAt }));
    }
  };

  const addChat = async (id, msg) => {
    const { data: row, error } = await sb.from('messages').insert({
      order_id:id, from_role:msg.from, text:msg.text, is_read:false,
      reply_to_id: msg.replyToId || null,
      mentions:    msg.mentions?.length > 0 ? msg.mentions : null,
    }).select().single();
    if (!error && row) {
      setChats(c => {
        const existing = c[id] || [];
        const newMsg = mapChat(row);
        if (existing.some(m => m.id === newMsg.id)) return c;
        return { ...c, [id]: [...existing, newMsg] };
      });
    }
  };

  const adjCount  = orders.filter(o => o.status === "調整中").length;
  const soudCount = orders.filter(o => ["日程相談中","キャンセル相談中","日程変更相談中"].includes(o.status)).length;

  if (loading) return (
    <div style={{ display:"flex", alignItems:"center", justifyContent:"center", height:"100vh",
      fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif",
      flexDirection:"column", gap:16, background:C.bg }}>
      <div style={{ fontSize:40 }}>⏳</div>
      <div style={{ fontSize:18, fontWeight:700, color:C.navy }}>受注データを読み込み中...</div>
    </div>
  );

  if (dbError) return (
    <div style={{ display:"flex", alignItems:"center", justifyContent:"center", height:"100vh",
      fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif",
      flexDirection:"column", gap:16, background:C.bg, padding:32 }}>
      <div style={{ fontSize:40 }}>⚠️</div>
      <div style={{ fontSize:18, fontWeight:700, color:C.red }}>データの読み込みに失敗しました</div>
      <div style={{ fontSize:13, color:C.gray, background:"#fff0f0", padding:"12px 20px",
        borderRadius:10, maxWidth:500 }}>{dbError}</div>
      <button onClick={fetchOrders} style={{ padding:"12px 24px", background:C.blue,
        color:C.white, border:"none", borderRadius:10, fontSize:15, fontWeight:700, cursor:"pointer" }}>
        再試行
      </button>
    </div>
  );

  return (
    <div style={{ display:"flex", height:"100vh", overflow:"hidden",
      fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" }}>
      <style>{`
        @keyframes urgentPulse { 0%,100%{opacity:1} 50%{opacity:0.65} }
        * { box-sizing:border-box; }
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-track { background:#f0f4f9; }
        ::-webkit-scrollbar-thumb { background:#c0cce0; border-radius:3px; }
      `}</style>

      {/* サイドバー */}
      <div style={{ width:60, background:C.sidebar, display:"flex", flexDirection:"column",
        alignItems:"center", padding:"16px 0", gap:14, flexShrink:0 }}>
        <div style={{ width:36, height:36, background:"rgba(255,255,255,0.2)",
          borderRadius:8, display:"flex", alignItems:"center", justifyContent:"center", fontSize:18 }}>
          📋
        </div>
        {(role === "admin" || role === "manager") && (
          <div title="企業ID管理"
            style={{ width:36, height:36, background:"rgba(255,255,255,0.08)",
            borderRadius:8, display:"flex", alignItems:"center", justifyContent:"center",
            fontSize:18, cursor:"pointer" }} onClick={()=>setShowComp(true)}>
            🏢
          </div>
        )}
        {role === "admin" && (
          <div title="スタッフ管理"
            style={{ width:36, height:36, background:showStaff?"rgba(41,82,200,0.4)":"rgba(255,255,255,0.08)",
            borderRadius:8, display:"flex", alignItems:"center", justifyContent:"center",
            fontSize:18, cursor:"pointer" }} onClick={()=>setShowStaff(true)}>
            👷
          </div>
        )}
        {role !== "staff" && (
          <div title="削除済み案件"
            style={{ width:36, height:36,
              background:showDeleted?"rgba(255,100,100,0.35)":"rgba(255,255,255,0.08)",
              borderRadius:8, display:"flex", alignItems:"center", justifyContent:"center",
              fontSize:18, cursor:"pointer" }} onClick={()=>setShowDeleted(d=>!d)}>
            🗑️
          </div>
        )}
        {(adjCount+soudCount)>0 && (
          <div style={{ background:C.red, color:C.white, borderRadius:"50%",
            width:28, height:28, display:"flex", alignItems:"center", justifyContent:"center",
            fontSize:12, fontWeight:900, animation:"urgentPulse 2s ease-in-out infinite" }}>
            {adjCount+soudCount}
          </div>
        )}
        <div style={{ flex:1 }}/>
        <button onClick={onLogout} style={{ width:44, height:44, background:"rgba(255,255,255,0.1)", border:"none", borderRadius:8, color:"rgba(255,255,255,0.7)", fontSize:10, cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:2 }}>
          <span style={{fontSize:16}}>🚪</span>
          <span>ログアウト</span>
        </button>
      </div>

      {showDeleted ? (
        <DeletedPanel onClose={()=>setShowDeleted(false)}
          onRestore={handleRestore} onHardDelete={handleHardDelete} />
      ) : (<>
        <OrderList role={role} orders={sorted} selected={selected} onSelect={setSelected}
          filter={filter} setFilter={setFilter} search={search} setSearch={setSearch}
          checkedIds={checkedIds}
          onToggleCheck={id=>setCheckedIds(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id])}
          onDeleteSelected={handleDelete} />

        <DetailPanel role={role} order={selected} chats={chats}
          onAddChat={addChat} onStatusChange={handleStatusChange}
          onEdit={handleEdit} onDelete={handleDelete} />
      </>)}

      {showComp  && <CompanyPanel onClose={()=>setShowComp(false)} />}
      {showStaff && <StaffPanel  onClose={()=>setShowStaff(false)} />}
    </div>
  );
}


    // ── メインルーター ──────────────────────────────────────
    function App() {
      const [screen, setScreen] = React.useState(() => {
        const params = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        return params.get('type') === 'recovery' ? 'resetpassword' : null;
      });
      const [userRole, setUserRole] = React.useState(null);
      const [detailOrder, setDetailOrder] = React.useState(null);
      const [detailViewOnly, setDetailViewOnly] = React.useState(false);
      const [chatBackTo, setChatBackTo] = React.useState("detail");

      React.useEffect(() => {
        const { data: { subscription } } = sb.auth.onAuthStateChange((event, session) => {
          if (event === 'PASSWORD_RECOVERY') {
            setScreen('resetpassword');
            return;
          }
          if (!session) {
            setUserRole(null);
            // パスワード再設定完了画面は維持（ユーザーが手動で「ログイン画面へ」を押すまで）
            setScreen(prev => prev === "resetpassword" ? prev : "login");
          } else {
            const role = session.user.user_metadata?.role ?? "user";
            setUserRole(role);
            // 初期ロードまたはログイン画面のときだけ遷移（操作中の画面は維持）
            setScreen(prev =>
              (prev === null || prev === "login")
                ? (["admin","manager","staff"].includes(role) ? "admin" : "history")
                : prev
            );
          }
        });
        return () => subscription.unsubscribe();
      }, []);

      const handleLogin = (role) => {
        setUserRole(role);
        setScreen(["admin","manager","staff"].includes(role) ? "admin" : "history");
      };

      const handleGoDetail = (order) => {
        setDetailOrder(order);
        setDetailViewOnly(false);
        setScreen("detail");
      };

      const handleGoDetailView = (order) => {
        setDetailOrder(order);
        setDetailViewOnly(true);
        setScreen("detail");
      };

      const handleGoChat = (order) => {
        setDetailOrder(order);
        setChatBackTo("history");
        setScreen("chat");
      };

      const handleDetailOpenChat = () => {
        setChatBackTo("detail");
        setScreen("chat");
      };

      const handleDetailStatusChange = (_, newStatus) => {
        setDetailOrder(prev => ({ ...prev, status: newStatus, statusChangedAt: Date.now() }));
      };

      if (screen === null) return (
        <div style={{ display:"flex", alignItems:"center", justifyContent:"center",
          height:"100vh", background:C.bg, flexDirection:"column", gap:16,
          fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" }}>
          <div style={{ fontSize:36 }}>🔐</div>
          <div style={{ fontSize:16, fontWeight:700, color:C.navy }}>認証確認中...</div>
        </div>
      );
      if (screen === "resetpassword") return <ResetPasswordScreen onDone={async () => { await sb.auth.signOut(); setScreen("login"); }} />;
      if (screen === "login")    return <LoginApp onLogin={handleLogin} onRegister={() => setScreen("register")} />;
      if (screen === "register") return <RegisterApp onDone={() => setScreen("login")} onBack={() => setScreen("login")} />;
      if (screen === "history")  return <HistoryApp role={userRole} onNewOrder={() => setScreen("order")} onMyPage={() => setScreen("mypage")} onLogout={() => setScreen("login")} onGoDetail={handleGoDetail} onGoDetailView={handleGoDetailView} onGoChat={handleGoChat} />;
      if (screen === "detail" && detailOrder) return <DetailScreen role={userRole} order={detailOrder} onBack={() => setScreen("history")} onOpenChat={handleDetailOpenChat} onStatusChange={handleDetailStatusChange} onChat={() => {}} viewOnly={detailViewOnly} />;
      if (screen === "chat" && detailOrder) return <ChatScreen role={userRole} order={detailOrder} onBack={() => setScreen(chatBackTo)} />;
      if (screen === "order")    return <OrderApp onDone={() => setScreen("history")} onBack={() => setScreen("history")} />;
      if (screen === "mypage")   return <MyPageApp onBack={() => setScreen("history")} onLogout={() => setScreen("login")} />;
      if (screen === "admin")    return <AdminApp role={userRole} onLogout={() => setScreen("login")} />;
      return null;
    }

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      render() {
        if (this.state.error) {
          return (
            <div style={{padding:"40px",fontFamily:"monospace",background:"#fff0f0",minHeight:"100vh"}}>
              <h2 style={{color:"#e63946",marginBottom:"16px",fontFamily:"sans-serif"}}>⚠️ エラーが発生しました</h2>
              <pre style={{background:"#fee",padding:"16px",borderRadius:"8px",
                fontSize:"13px",overflow:"auto",whiteSpace:"pre-wrap",
                border:"1px solid #e63946",lineHeight:"1.6"}}>
                {this.state.error.toString()}{'\n\n'}{this.state.error.stack}
              </pre>
            </div>
          );
        }
        return this.props.children;
      }
    }

    try {
      ReactDOM.createRoot(document.getElementById('root')).render(
        <ErrorBoundary><App /></ErrorBoundary>
      );
    } catch(err) {
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;background:#fff0f0;font-family:monospace;min-height:100vh">' +
        '<h2 style="color:#e63946;font-family:sans-serif;margin-bottom:16px">⚠️ 初期化エラー</h2>' +
        '<pre style="background:#fee;padding:16px;border-radius:8px;font-size:13px;white-space:pre-wrap;border:1px solid #e63946">' +
        (err.name + ': ' + err.message + '\n\n' + (err.stack || '')).replace(/</g,'&lt;') +
        '</pre></div>';
    }

  </script>
  <script>
    (function() {
      try {
        var src = document.getElementById('jsx-source').textContent;
        var compiled = Babel.transform(src, {
          presets: ['react'],
          filename: 'app.jsx'
        }).code;
        new Function('React', 'ReactDOM', compiled)(window.React, window.ReactDOM);
      } catch(e) {
        var msg = (e.name || 'Error') + ': ' + e.message + '\n\n' + (e.stack || '');
        msg = msg.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        document.getElementById('root').innerHTML =
          '<div style="padding:40px;background:#fff0f0;font-family:monospace;min-height:100vh">' +
          '<h2 style="color:#e63946;font-family:sans-serif;margin-bottom:16px">&#9888;&#65039; エラーが発生しました</h2>' +
          '<pre style="background:#fee;padding:16px;border-radius:8px;font-size:13px;' +
          'white-space:pre-wrap;border:1px solid #e63946;line-height:1.6;overflow:auto">' +
          msg + '</pre></div>';
      }
    })();
  </script>
</body>
</html>
